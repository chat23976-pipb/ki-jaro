        function calculateSkorRisiko(p, d) {
            const val = parseInt(p) * parseInt(d);
            let kuadran = '';
            let warna = '';
            let level = '';

            if (val >= 20) { level = 'Sangat Tinggi (5)'; kuadran = 'Kuadran IV (Sangat Tinggi)'; warna = 'bg-rose-600 text-white'; }
            else if (val >= 15) { level = 'Tinggi (4)'; kuadran = 'Kuadran III (Tinggi)'; warna = 'bg-amber-500 text-white'; }
            else if (val >= 12) { level = 'Sedang (3)'; kuadran = 'Kuadran II (Sedang)'; warna = 'bg-yellow-400 text-slate-900'; }
            else if (val >= 7) { level = 'Rendah (2)'; kuadran = 'Kuadran I (Rendah)'; warna = 'bg-emerald-500 text-white'; }
            else { level = 'Sangat Rendah (1)'; kuadran = 'Kuadran I (Sangat Rendah)'; warna = 'bg-blue-500 text-white'; }

            return { skor: val, level, kuadran, warna };
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-white shadow-lg flex items-center space-x-3 transition-all transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        async function deleteRenstra(type, idx) {
            let canDelete = true;
            if (type === 'tujuanKemenperin') {
                const item = DB.renstraTujuanKemenperin[idx];
                if (DB.renstraBPSDMI.some(b => b.tujuanKemenperinId === item.id)) canDelete = false;
            } else if (type === 'bpsdmi') {
                const item = DB.renstraBPSDMI[idx];
                if (DB.renstraSasaranKinerja.some(s => s.bpsdmiId === item.id)) canDelete = false;
            } else if (type === 'sasaranKinerja') {
                const item = DB.renstraSasaranKinerja[idx];
                if (DB.renstraIndikatorKinerja.some(i => i.sasaranKinerjaId === item.id)) canDelete = false;
            } else if (type === 'indikatorKinerja') {
                const item = DB.renstraIndikatorKinerja[idx];
                if (DB.cascadingDirektur.some(c => c.indikatorId === item.id)) canDelete = false;
            }

            if (!canDelete) {
                showToast('Data ini tidak dapat dihapus karena sudah digunakan dalam cascading ke level berikutnya!', 'error');
                return;
            }

            if (confirm('Apakah Anda yakin ingin menghapus data Renstra ini?')) {
                if (type === 'tujuanKemenperin') DB.renstraTujuanKemenperin.splice(idx, 1);
                else if (type === 'bpsdmi') DB.renstraBPSDMI.splice(idx, 1);
                else if (type === 'sasaranKinerja') DB.renstraSasaranKinerja.splice(idx, 1);
                else if (type === 'indikatorKinerja') DB.renstraIndikatorKinerja.splice(idx, 1);
                
                await saveToMySQL();
                showToast('Data berhasil dihapus.', 'info');
                renderRenstraView(document.getElementById('mainContent'));
            }
        }

        function renderDashboardView(container) {
            document.getElementById('pageTitle').innerText = 'Dashboard Capaian Kinerja & Peta Risiko';
            
            let validCapaian = DB.capaian.filter(c => c.status === 'Valid');
            if (filterDashboardTahun !== 'Semua') {
                validCapaian = validCapaian.filter(c => c.tahun === filterDashboardTahun);
            }
            if (filterDashboardTriwulan !== 'Semua') {
                validCapaian = validCapaian.filter(c => c.triwulan === filterDashboardTriwulan);
            }
            if (filterDashboardTim !== 'Semua') {
                validCapaian = validCapaian.filter(c => c.timKey === filterDashboardTim);
            }
            if (filterDashboardUnit !== 'Semua') {
                validCapaian = validCapaian.filter(c => c.unit === filterDashboardUnit);
            }

            let filteredCascading = DB.cascadingDirektur;
            if (filterDashboardTahun !== 'Semua') {
                filteredCascading = filteredCascading.filter(c => c.tahun === filterDashboardTahun);
            }
            if (filterDashboardTim !== 'Semua') {
                filteredCascading = filteredCascading.filter(c => c.timKeys.includes(filterDashboardTim));
            }

            let totalValidIndikator = filteredCascading.length;
            let achievedCount = 0;
            filteredCascading.forEach(cd => {
                let matched = validCapaian.filter(c => c.targetDirektur === cd.target && c.tahun === cd.tahun);
                if (filterDashboardTriwulan !== 'Semua') {
                    matched = matched.filter(c => c.triwulan === filterDashboardTriwulan);
                }
                if (matched.length > 0) {
                    const avgReal = matched.reduce((a,b)=>a+b.realisasi,0)/matched.length;
                    const targetVal = cd.targetVal !== undefined ? cd.targetVal : 100;
                    if (avgReal >= targetVal) achievedCount++;
                }
            });

            // Role-filtered achieved count scorecard
            let myFilteredCascading = filteredCascading;
            let myValidCapaian = validCapaian;
            if (currentUser.role === 'ketua_unit') {
                myValidCapaian = validCapaian.filter(c => c.unit === currentUser.unit);
                const assignedTargets = DB.cascadingTim.filter(ct => ct.unitTargets.includes(currentUser.unit)).map(ct => ct.targetDirektur);
                myFilteredCascading = filteredCascading.filter(cd => assignedTargets.includes(cd.target));
            } else if (currentUser.role === 'tim_kerja') {
                myValidCapaian = validCapaian.filter(c => c.timKey === currentUser.timKey);
                myFilteredCascading = filteredCascading.filter(cd => cd.timKeys.includes(currentUser.timKey));
            }
            
            let roleAchievedCount = 0;
            let roleTotalIndikator = myFilteredCascading.length;
            myFilteredCascading.forEach(cd => {
                let matched = myValidCapaian.filter(c => c.targetDirektur === cd.target && c.tahun === cd.tahun);
                if (filterDashboardTriwulan !== 'Semua') {

                                            const efektif = pOutput >= targetVal ? 'Efektif' : 'Tidak Efektif';
                                            const efisien = pOutput >= pAnggaran ? 'Efisien' : 'Tidak Efisien';
                                            const kesimpulan = `${efektif} & ${efisien}`;

                                            return `
                                                <tr class="hover:bg-slate-50">
                                                    <td class="p-3">
                                                        <span class="px-2 py-0.5 bg-blue-50 text-primary-700 font-bold text-[10px] rounded mr-1">${ra.tahun}</span>
                                                        <span class="font-semibold text-slate-800">${ra.triwulan}</span>
                                                    </td>
                                                    <td class="p-3 font-semibold text-slate-900">${ik ? ik.namaIndikator : '-'}</td>
                                                    <td class="p-3 text-center font-medium">Rp ${Number(pagu).toLocaleString('id-ID')}</td>
                                                    <td class="p-3 text-center font-bold text-emerald-700">Rp ${Number(realAnggaran).toLocaleString('id-ID')}</td>
                                                    <td class="p-3 text-center font-bold text-slate-700">${pAnggaran.toFixed(1)}%</td>
                                                    <td class="p-3 text-center font-bold text-primary-700">${pOutput.toFixed(1)}%</td>
                                                    <td class="p-3 text-center font-bold ${gap >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${gap > 0 ? '+' : ''}${gap.toFixed(1)}%</td>
                                                    <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${efektif === 'Efektif' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">${efektif}</span></td>
                                                    <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${efisien === 'Efisien' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">${efisien}</span></td>
                                                    <td class="p-3 text-center font-bold text-slate-800">${kesimpulan}</td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Budget Realization Summary Table (Pagu vs Realisasi vs Sisa) -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                            <div>
                                <h3 class="font-bold text-slate-900 text-base">Tabel Realisasi Anggaran per Indikator Kinerja</h3>
                                <p class="text-xs text-slate-500">Ringkasan Pagu Anggaran Tersedia, Realisasi Anggaran Riil, % Realisasi, dan Sisa Anggaran</p>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">
                                            <th class="p-3">Indikator Kinerja</th>
                                            <th class="p-3 text-center">Anggaran Tersedia (Pagu)</th>
                                            <th class="p-3 text-center">Realisasi Anggaran</th>
                                            <th class="p-3 text-center">% Realisasi Anggaran</th>
                                            <th class="p-3 text-center">Sisa Anggaran</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${DB.renstraIndikatorKinerja.length === 0 ? `<tr><td colspan="5" class="p-4 text-center text-slate-400">Belum ada indikator Renstra</td></tr>` : DB.renstraIndikatorKinerja.map(ik => {
                                            const pagu = ik.anggaran2025 || 100000000;
                                            const totalReal = DB.realisasiAnggaranAdmin.filter(ra => ra.indikatorId === ik.id).reduce((a,b)=>a+b.realisasiAnggaran,0);
                                            const pReal = pagu > 0 ? ((totalReal / pagu) * 100).toFixed(1) : 0;
                                            const sisa = pagu - totalReal;

                                            return `
                                                <tr class="hover:bg-slate-50">
                                                    <td class="p-3 font-semibold text-slate-900">${ik.namaIndikator}</td>
                                                    <td class="p-3 text-center font-medium">Rp ${Number(pagu).toLocaleString('id-ID')}</td>
                                                    <td class="p-3 text-center font-bold text-emerald-700">Rp ${Number(totalReal).toLocaleString('id-ID')}</td>
                                                    <td class="p-3 text-center font-bold">${pReal}%</td>
                                                    <td class="p-3 text-center font-bold ${sisa >= 0 ? 'text-blue-700' : 'text-rose-600'}">Rp ${Number(sisa).toLocaleString('id-ID')}</td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Charts Grid with Independent Filters for Line Chart -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4">
                                <div>
                                    <h3 class="font-bold text-slate-900 text-base">Grafik Capaian Indikator Utama (Line Chart)</h3>
                                    <p class="text-xs text-slate-500">Dilengkapi filter khusus untuk grafik lini</p>
                                </div>
                                <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
                                    <select onchange="filterChartTahun = this.value; renderDashboardView(document.getElementById('mainContent'));" class="p-2 bg-slate-50 border rounded-xl text-xs font-semibold">
                                        <option value="Semua" ${filterChartTahun === 'Semua' ? 'selected' : ''}>Semua Tahun</option>
                                        <option value="2025" ${filterChartTahun === '2025' ? 'selected' : ''}>2025</option>
                                        <option value="2026" ${filterChartTahun === '2026' ? 'selected' : ''}>2026</option>
                                        <option value="2027" ${filterChartTahun === '2027' ? 'selected' : ''}>2027</option>
                                        <option value="2028" ${filterChartTahun === '2028' ? 'selected' : ''}>2028</option>
                                        <option value="2029" ${filterChartTahun === '2029' ? 'selected' : ''}>2029</option>
                                    </select>
                                    <select onchange="filterChartTriwulan = this.value; renderDashboardView(document.getElementById('mainContent'));" class="p-2 bg-slate-50 border rounded-xl text-xs font-semibold">
                                        <option value="Semua" ${filterChartTriwulan === 'Semua' ? 'selected' : ''}>Semua Triwulan</option>
                                        <option value="TW 1" ${filterChartTriwulan === 'TW 1' ? 'selected' : ''}>TW 1</option>
                                        <option value="TW 2" ${filterChartTriwulan === 'TW 2' ? 'selected' : ''}>TW 2</option>
                                        <option value="TW 3" ${filterChartTriwulan === 'TW 3' ? 'selected' : ''}>TW 3</option>
                                        <option value="TW 4" ${filterChartTriwulan === 'TW 4' ? 'selected' : ''}>TW 4</option>
                                    </select>
                                    <select onchange="filterChartTim = this.value; renderDashboardView(document.getElementById('mainContent'));" class="p-2 bg-slate-50 border rounded-xl text-xs font-semibold">
                                        <option value="Semua" ${filterChartTim === 'Semua' ? 'selected' : ''}>Semua Tim</option>${DB.timKerjaList.map(t => `<option value="${t}" ${filterChartTim === t ? 'selected' : ''}>${t}</option>`).join('')}
                                    </select>
                                    <select onchange="filterChartUnit = this.value; renderDashboardView(document.getElementById('mainContent'));" class="p-2 bg-slate-50 border rounded-xl text-xs font-semibold">
                                        <option value="Semua" ${filterChartUnit === 'Semua' ? 'selected' : ''}>Semua Unit</option>${DB.unitList.map(u => `<option value="${u}" ${filterChartUnit === u ? 'selected' : ''}>${u}</option>`).join('')}
                                    </select>
                                    <select onchange="filterChartIndikator = this.value; renderDashboardView(document.getElementById('mainContent'));" class="p-2 bg-slate-50 border rounded-xl text-xs font-semibold">
                                        <option value="Semua" ${filterChartIndikator === 'Semua' ? 'selected' : ''}>Semua Indikator</option>${DB.renstraIndikatorKinerja.map(ik => `<option value="${ik.namaIndikator}" ${filterChartIndikator === ik.namaIndikator ? 'selected' : ''}>${ik.namaIndikator}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div class="relative min-h-[360px]">
                                <canvas id="capaianChart"></canvas>
                            </div>
                        </div>

                        <!-- Budget Realization Chart -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                            <div class="flex items-center justify-between border-b pb-4">
                                <div>
                                    <h3 class="font-bold text-slate-900 text-base">Grafik Realisasi Anggaran Riil per Indikator</h3>
                                    <p class="text-xs text-slate-500">Perbandingan Pagu Anggaran vs Realisasi Anggaran Riil</p>
                                </div>
                            </div>
                            <div class="relative min-h-[320px]">
                                <canvas id="anggaranChart"></canvas>
                            </div>
                        </div>

                        <!-- Risk Maps (Pre-Control & Residu) with Year Filter -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                                <div class="flex items-center justify-between mb-4">
                                    <div>
                                        <h3 class="font-bold text-slate-900 text-base">Peta Risiko (Sebelum Pengendalian / Inherent)</h3>
                                        <p class="text-xs text-slate-500">Matriks 5x5 Sebelum Mitigasi</p>
                                    </div>
                                    <span class="text-xs font-semibold bg-amber-50 text-amber-700 px-3 py-1 rounded-full">Pre-Control</span>
                                </div>
                                <div class="flex-1 relative min-h-[340px]">
                                    <canvas id="petaRisikoPreChart"></canvas>
                                </div>
                            </div>

                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                                <div class="flex items-center justify-between mb-4">
                                    <div>
                                        <h3 class="font-bold text-slate-900 text-base">Peta Risiko (Sesudah Pengendalian / Residu)</h3>
                                        <p class="text-xs text-slate-500">Matriks 5x5 Sesudah Mitigasi</p>
                                    </div>
                                    <span class="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full">Residu</span>
                                </div>
                                <div class="flex-1 relative min-h-[340px]">
                                    <canvas id="petaRisikoResiduChart"></canvas>
                                </div>
                            </div>
                        </div>

                        <!-- Top 10 Risks List View (No Truncated Bars) -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                            <div class="flex items-center justify-between mb-4">
                                <div>
                                    <h3 class="font-bold text-slate-900 text-base">10 Risiko Tertinggi (Prioritas Utama)</h3>
                                    <p class="text-xs text-slate-500">Daftar lengkap prioritas risiko tertinggi berbentuk list teks penuh</p>
                                </div>
                                <span class="text-xs font-semibold bg-rose-50 text-rose-700 px-3 py-1 rounded-full"><i class="fa-solid fa-star mr-1"></i> Top Prioritas</span>
                            </div>
                            <div class="overflow-y-auto max-h-[380px] divide-y divide-slate-100 text-xs">
                                ${filteredRisiko.length === 0 ? `<p class="p-6 text-center text-slate-400">Belum ada data risiko.</p>` : 
                                    [...filteredRisiko].sort((a,b) => b.skor1 - a.skor1).slice(0, 10).map((r, i) => `
                                        <div class="py-3.5 flex items-start justify-between space-x-3">
                                            <div class="flex items-start space-x-3">
                                                <span class="w-7 h-7 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center font-bold text-xs shrink-0">${i+1}</span>
                                                <div>
                                                    <p class="font-bold text-slate-900 text-sm">${r.pernyataan}</p>
                                                    <p class="text-slate-500 text-xs mt-1">Unit: <strong class="text-slate-700">${r.unit}</strong> | Indikator: <span class="text-primary-700">${r.targetDirektur || '-'}</span> | Dampak: ${r.dampak}</p>
                                                </div>
                                            </div>
                                            <div class="text-right shrink-0">
                                                <span class="px-2.5 py-1 rounded font-bold text-xs ${r.warnaResidu}">Skor Residu: ${r.skor2}</span>
                                                <span class="block text-[11px] text-slate-400 mt-1">Awal: ${r.skor1}</span>
                                            </div>
                                        </div>
                                    `).join('')
                                }
                            </div>
                        </div>
                    `}
                </div>
            `;

            if (DB.cascadingDirektur.length > 0) {
                setTimeout(() => {
                    const ctx1 = document.getElementById('capaianChart').getContext('2d');
                    
                    let chartLabels, chartDataDatasets;

                    if (filterChartTriwulan === 'Semua') {
                        chartLabels = ['Triwulan 1', 'Triwulan 2', 'Triwulan 3', 'Triwulan 4'];
                        let twPeriods = ['TW 1', 'TW 2', 'TW 3', 'TW 4'];
                        chartDataDatasets = twPeriods.map(tw => {
                            let subset = validCapaian.filter(c => c.triwulan === tw);
                            if (filterChartTahun !== 'Semua') subset = subset.filter(c => c.tahun === filterChartTahun);
                            if (filterChartTim !== 'Semua') subset = subset.filter(c => c.timKey === filterChartTim);
                            if (filterChartUnit !== 'Semua') subset = subset.filter(c => c.unit === filterChartUnit);
                            if (filterChartIndikator !== 'Semua') subset = subset.filter(c => c.targetDirektur === filterChartIndikator);
                            if (subset.length === 0) return 0;
                            return Number((subset.reduce((a,b) => a + b.realisasi, 0) / subset.length).toFixed(1));
                        });
                    } else {
                        let filteredInd = DB.cascadingDirektur;
                        if (filterChartTahun !== 'Semua') filteredInd = filteredInd.filter(c => c.tahun === filterChartTahun);
                        if (filterChartTim !== 'Semua') filteredInd = filteredInd.filter(c => c.timKeys.includes(filterChartTim));
                        if (filterChartIndikator !== 'Semua') filteredInd = filteredInd.filter(c => c.target === filterChartIndikator);

                        chartLabels = filteredInd.map(cd => cd.target.length > 25 ? cd.target.substring(0, 25) + '...' : cd.target);
                        chartDataDatasets = filteredInd.map(cd => {
                            let matches = validCapaian.filter(c => c.targetDirektur === cd.target && c.tahun === cd.tahun);
                            if (filterChartTriwulan !== 'Semua') matches = matches.filter(c => c.triwulan === filterChartTriwulan);
                            if (filterChartUnit !== 'Semua') matches = matches.filter(c => c.unit === filterChartUnit);
                            if (matches.length > 0) {
                                return Number((matches.reduce((a, b) => a + b.realisasi, 0) / matches.length).toFixed(1));
                            }
                            return 0;
                        });
                    }

                    new Chart(ctx1, {
                        type: 'line',
                        data: {
                            labels: chartLabels,
                            datasets: [
                                { 
                                    label: filterChartTriwulan === 'Semua' ? 'Progres Triwulanan (%)' : 'Realisasi Kinerja (%)', 
                                    data: chartDataDatasets, 
                                    borderColor: '#2563eb', 
                                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                                    borderWidth: 3,
                                    fill: true,
                                    tension: 0.3,
                                    pointRadius: 6,
                                    pointBackgroundColor: '#2563eb'
                                }
                            ]
                        },
                        plugins: [ChartDataLabels],
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false,
                            layout: { padding: { top: 30, right: 15, bottom: 15, left: 15 } },
                            scales: {
                                y: { beginAtZero: true, max: 125 }
                            },
                            plugins: { 
                                legend: { position: 'bottom' },
                                datalabels: {
                                    align: 'top',
                                    font: { weight: 'bold', size: 11 },
                                    formatter: (value) => value > 0 ? value + '%' : '-'
                                }
                            } 
                        }
                    });

                    // Budget Realization Bar Chart
                    const ctxAnggaran = document.getElementById('anggaranChart').getContext('2d');
                    const ikLabels = DB.renstraIndikatorKinerja.map(ik => ik.namaIndikator.length > 20 ? ik.namaIndikator.substring(0, 20) + '...' : ik.namaIndikator);
                    const paguData = DB.renstraIndikatorKinerja.map(ik => ik.anggaran2025 || 100000000);
                    const realData = DB.renstraIndikatorKinerja.map(ik => {
                        return DB.realisasiAnggaranAdmin.filter(ra => ra.indikatorId === ik.id).reduce((a,b)=>a+b.realisasiAnggaran,0);
                    });

                    new Chart(ctxAnggaran, {
                        type: 'bar',
                        data: {
                            labels: ikLabels,
                            datasets: [
                                { label: 'Pagu Anggaran (Rp)', data: paguData, backgroundColor: '#3b82f6', borderRadius: 6 },
                                { label: 'Realisasi Anggaran (Rp)', data: realData, backgroundColor: '#10b981', borderRadius: 6 }
                            ]
                        },
                        plugins: [ChartDataLabels],
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            layout: { padding: { top: 25, right: 15, bottom: 15, left: 15 } },
                            scales: { y: { beginAtZero: true } },
                            plugins: {
                                legend: { position: 'bottom' },
                                datalabels: {
                                    anchor: 'end', align: 'top', font: { weight: 'bold', size: 10 },
                                    formatter: (value) => value > 0 ? 'Rp ' + (value/1000000).toFixed(1) + 'Jt' : '0'
                                }
                            }
                        }
                    });

                    // Risk Bubbles with padding to prevent clipping
                    const ctxPre = document.getElementById('petaRisikoPreChart').getContext('2d');
                    const preData = filteredRisiko.map(r => ({
                        x: r.damp1, y: r.prob1, r: Math.max(12, r.skor1 * 1.2), label: r.pernyataan, skor: r.skor1
                    }));
                    new Chart(ctxPre, {
                        type: 'bubble',
                        data: {
                            datasets: [{
                                label: 'Risiko Pre-Control',
                                data: preData,
                                backgroundColor: 'rgba(239, 68, 68, 0.75)',
                                borderColor: '#0f172a', borderWidth: 1
                            }]
                        },
                        plugins: [ChartDataLabels],
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            layout: { padding: { top: 30, right: 30, bottom: 20, left: 20 } },
                            scales: {
                                x: { title: { display: true, text: 'Level Dampak (1-5)' }, min: 0.5, max: 5.5, ticks: { stepSize: 1 } },
                                y: { title: { display: true, text: 'Level Kemungkinan (1-5)' }, min: 0.5, max: 5.5, ticks: { stepSize: 1 } }
                            },
                            plugins: {
                                legend: { display: false },
                                datalabels: {
                                    align: 'center', font: { weight: 'bold', size: 11 }, color: '#ffffff',
                                    formatter: (value) => `Skor:${value.skor}`
                                }
                            }
                        }
                    });

                    const ctxResidu = document.getElementById('petaRisikoResiduChart').getContext('2d');
                    const residuData = filteredRisiko.map(r => ({
                        x: r.damp2, y: r.prob2, r: Math.max(12, r.skor2 * 1.2), label: r.pernyataan, skor: r.skor2
                    }));
                    new Chart(ctxResidu, {
                        type: 'bubble',
                        data: {
                            datasets: [{
                                label: 'Risiko Residu',
                                data: residuData,
                                backgroundColor: 'rgba(16, 185, 129, 0.75)',
                                borderColor: '#0f172a', borderWidth: 1
                            }]
                        },
                        plugins: [ChartDataLabels],
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            layout: { padding: { top: 30, right: 30, bottom: 20, left: 20 } },
                            scales: {
                                x: { title: { display: true, text: 'Level Dampak (1-5)' }, min: 0.5, max: 5.5, ticks: { stepSize: 1 } },
                                y: { title: { display: true, text: 'Level Kemungkinan (1-5)' }, min: 0.5, max: 5.5, ticks: { stepSize: 1 } }
                            },
                            plugins: {
                                legend: { display: false },
                                datalabels: {
                                    align: 'center', font: { weight: 'bold', size: 11 }, color: '#ffffff',
                                    formatter: (value) => `Skor:${value.skor}`
                                }
                            }
                        }
                    });
                }, 100);
            }
        }

        // === FUNGSI SINKRONISASI OTOMATIS & AMAN KE MYSQL ===
        async function loadDataFromMySQL() {
            try {
                const response = await fetch('/api/load-state/main_kijaro');
                const result = await response.json();
                if (result.success && result.data) {
                    Object.assign(DB, result.data);
                    console.log("Data berhasil dimuat dari MySQL.");
                }
            } catch (e) {
                console.error("Gagal memuat dari MySQL:", e);
            }
        }

        async function saveToMySQL() {
            try {
                await fetch('/api/save-state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        key: 'main_kijaro',
                        value: DB
                    })
                });
                console.log("Data otomatis tersimpan ke MySQL.");
            } catch (e) {
                console.error("Gagal menyimpan ke MySQL:", e);
            }
        }

        // AUTO-SAVE BACKGROUND LISTENER: Memantau setiap klik tombol simpan/tambah/hapus di seluruh aplikasi secara aman
        document.addEventListener('click', async function(e) {
            if (e.target && (e.target.tagName === 'BUTTON' || e.target.type === 'submit')) {
                const text = e.target.innerText.toLowerCase();
                if (text.includes('simpan') || text.includes('tambah') || text.includes('hapus') || text.includes('update') || text.includes('validasi')) {
                    setTimeout(async () => {
                        await saveToMySQL();
                    }, 800);
                }
            }
        });

        // Jalankan saat halaman pertama kali dibuka
        window.onload = async function() {
            await loadDataFromMySQL();
            const savedUser = localStorage.getItem('ki_jaro_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                renderDashboardLayout();
            } else {
                renderLogin();
            }
        }
    </script>
</body>
</html>
