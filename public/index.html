            lastUpdated: 0
        };

        let currentUser = null;
        let activeTab = 'dashboard';
        let chartInstances = {};
        let isServerConnected = false;
        
        let filterDashboardTahun = '2025';
        let filterDashboardTriwulan = 'Semua';
        let filterDashboardTim = 'Semua';
        let filterDashboardUnit = 'Semua';

        let filterCapaianTahun = 'Semua';
        let filterCapaianTriwulan = 'Semua';

        // ============================================================================
        // 2. DATA SYNC ENGINE (LOCALSTORAGE + MYSQL BACKGROUND)
        // ============================================================================
        const LS_DB_KEY = 'ki_jaro_master_db';

        function ensureDefaultUsersExist(customUsers) {
            const merged = DEFAULT_USERS.map(u => ({ ...u }));
            if (Array.isArray(customUsers)) {
                customUsers.forEach(cu => {
                    if (!cu || !cu.username) return;
                    const idx = merged.findIndex(m => String(m.username).toLowerCase() === String(cu.username).toLowerCase());
                    if (idx !== -1) {
                        merged[idx] = {
                            ...merged[idx],
                            ...cu,
                            username: String(cu.username).trim(),
                            password: (cu.password !== undefined && String(cu.password).trim() !== '') ? String(cu.password).trim() : merged[idx].password
                        };
                    } else {
                        merged.push({
                            ...cu,
                            username: String(cu.username).trim(),
                            password: String(cu.password || '123').trim()
                        });
                    }
                });
            }
            return merged;
        }

        function sanitizeAndMergeDB(incoming) {
            if (!incoming || typeof incoming !== 'object') return;
            if (incoming.value && typeof incoming.value === 'object') incoming = incoming.value;
            else if (incoming.data && typeof incoming.data === 'object') incoming = incoming.data;

            DB.users = ensureDefaultUsersExist(incoming.users);
            DB.timKerjaList = (Array.isArray(incoming.timKerjaList) && incoming.timKerjaList.length > 0) ? incoming.timKerjaList : [...DEFAULT_TIM_LIST];
            DB.unitList = (Array.isArray(incoming.unitList) && incoming.unitList.length > 0) ? incoming.unitList : [...DEFAULT_UNIT_LIST];

            const arrayFields = [
                'renstraTujuanKemenperin', 'renstraBPSDMI', 'renstraSasaranKinerja', 'renstraIndikatorKinerja',
                'cascadingDirektur', 'cascadingTim', 'capaian', 'risiko', 'realisasiAnggaranAdmin'
            ];
            arrayFields.forEach(field => {
                if (Array.isArray(incoming[field])) DB[field] = incoming[field];
                else if (!Array.isArray(DB[field])) DB[field] = [];
            });

            if (Array.isArray(incoming.dokumenPerencanaan)) DB.dokumenPerencanaan = incoming.dokumenPerencanaan;
            if (incoming.spreadsheetUrl) DB.spreadsheetUrl = incoming.spreadsheetUrl;
            if (incoming.lastUpdated) DB.lastUpdated = Number(incoming.lastUpdated) || 0;
        }

        function countTotalRecords(obj) {
            if (!obj || typeof obj !== 'object') return 0;
            return (
                (Array.isArray(obj.renstraTujuanKemenperin) ? obj.renstraTujuanKemenperin.length : 0) +
                (Array.isArray(obj.renstraBPSDMI) ? obj.renstraBPSDMI.length : 0) +
                (Array.isArray(obj.renstraSasaranKinerja) ? obj.renstraSasaranKinerja.length : 0) +
                (Array.isArray(obj.renstraIndikatorKinerja) ? obj.renstraIndikatorKinerja.length : 0) +
                (Array.isArray(obj.cascadingDirektur) ? obj.cascadingDirektur.length : 0) +
                (Array.isArray(obj.cascadingTim) ? obj.cascadingTim.length : 0) +
                (Array.isArray(obj.capaian) ? obj.capaian.length : 0) +
                (Array.isArray(obj.risiko) ? obj.risiko.length : 0) +
                (Array.isArray(obj.realisasiAnggaranAdmin) ? obj.realisasiAnggaranAdmin.length : 0)
            );
        }

        function loadFromLocalCache() {
            try {
                const raw = localStorage.getItem(LS_DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    sanitizeAndMergeDB(parsed);
                    return parsed;
                }
            } catch (e) {}
            return null;
        }

        function saveToLocalCache() {
            try {
                localStorage.setItem(LS_DB_KEY, JSON.stringify(DB));
            } catch (e) {}
        }

        async function loadDataFromMySQL() {
            const localCopy = loadFromLocalCache();
            const localRecords = countTotalRecords(localCopy);
            const localTime = localCopy && localCopy.lastUpdated ? Number(localCopy.lastUpdated) : 0;

            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 3500);
                const response = await fetch('/api/load-state/main_kijaro?t=' + Date.now(), {
                    method: 'GET',
                    headers: { 'Cache-Control': 'no-cache' },
                    signal: controller.signal
                });
                clearTimeout(timer);

                if (response.ok) {
                    const result = await response.json();
                    let serverData = null;
                    if (result && result.data) serverData = typeof result.data === 'string' ? JSON.parse(result.data) : result.data;
                    else if (result && result.value) serverData = typeof result.value === 'string' ? JSON.parse(result.value) : result.value;
                    else if (result && Array.isArray(result.users)) serverData = result;

                    if (serverData && typeof serverData === 'object') {
                        const serverRecords = countTotalRecords(serverData);
                        const serverTime = Number(serverData.lastUpdated || 0);

                        if (serverRecords > 0 && serverTime >= localTime) {
                            sanitizeAndMergeDB(serverData);
                            saveToLocalCache();
                        } else if (localRecords > 0 && serverRecords === 0) {
                            await pushStateToMySQL();
                        } else if (serverRecords > 0) {
                            sanitizeAndMergeDB(serverData);
                            saveToLocalCache();
                        }
                        isServerConnected = true;
                        updateStatusIndicator();
                        return true;
                    }
                }
            } catch (e) {}

            isServerConnected = false;
            updateStatusIndicator();
            return false;
        }

        async function pushStateToMySQL() {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 4000);
            const res = await fetch('/api/save-state', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: 'main_kijaro', value: DB }),
                signal: controller.signal
            });
            clearTimeout(timer);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            isServerConnected = true;
            updateStatusIndicator();
        }

        async function saveToMySQL() {
            DB.lastUpdated = Date.now();
            saveToLocalCache();
            try {
                await pushStateToMySQL();
            } catch (e) {
                isServerConnected = false;
                updateStatusIndicator();
            }
        }

        function updateStatusIndicator() {
            const el = document.getElementById('dbStatusBadge');
            if (!el) return;
            if (isServerConnected) {
                el.className = "px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-[11px] font-semibold flex items-center space-x-1.5";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>MySQL Sync Aktif</span>`;
            } else {
                el.className = "px-2.5 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-full text-[11px] font-semibold flex items-center space-x-1.5";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>Tersimpan Lokal</span>`;
            }
        }

        function calculateSkorRisiko(p, d) {
            const val = (parseInt(p) || 1) * (parseInt(d) || 1);
            let kuadran = '', warna = '', level = '';
            if (val >= 20) { level = 'Sangat Tinggi (5)'; kuadran = 'Kuadran IV (Sangat Tinggi)'; warna = 'bg-rose-600 text-white'; }
            else if (val >= 15) { level = 'Tinggi (4)'; kuadran = 'Kuadran III (Tinggi)'; warna = 'bg-amber-500 text-white'; }
            else if (val >= 12) { level = 'Sedang (3)'; kuadran = 'Kuadran II (Sedang)'; warna = 'bg-yellow-400 text-slate-900'; }
            else if (val >= 7) { level = 'Rendah (2)'; kuadran = 'Kuadran I (Rendah)'; warna = 'bg-emerald-500 text-white'; }
            else { level = 'Sangat Rendah (1)'; kuadran = 'Kuadran I (Sangat Rendah)'; warna = 'bg-blue-500 text-white'; }
            return { skor: val, level, kuadran, warna };
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');

            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-white shadow-lg flex items-center space-x-3 transition-all ${

            }`;
            toast.innerHTML = `<span class="text-sm font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        function quickLogin(u, p) {
            const uEl = document.getElementById('usernameInput');

            if (uEl && pEl) {

                pEl.value = p;
            }
            executeLoginAuth(u, p);
        }

        function handleLogin(e) {
            if (e && e.preventDefault) e.preventDefault();
            const u = document.getElementById('usernameInput') ? document.getElementById('usernameInput').value : '';
            const p = document.getElementById('passwordInput') ? document.getElementById('passwordInput').value : '';
            executeLoginAuth(u, p);
        }

        function executeLoginAuth(rawUser, rawPass) {
            const u = String(rawUser || '').trim().toLowerCase();
            const p = String(rawPass || '').trim();

            DB.users = ensureDefaultUsersExist(DB.users);

            let found = DB.users.find(x =>
                String(x.username || '').trim().toLowerCase() === u &&
                String(x.password || '').trim() === p
            );

            if (!found) {
                found = DEFAULT_USERS.find(x =>
                    String(x.username || '').trim().toLowerCase() === u &&
                    String(x.password || '').trim() === p
                );
            }

            if (found) {
                currentUser = found;
                try { localStorage.setItem('ki_jaro_user', JSON.stringify(currentUser)); } catch (err) {}
                showToast(`Selamat datang, ${currentUser.name}`);
                renderDashboardLayout();
            } else {
                showToast('Username atau password salah! (Gunakan password: 123)', 'error');
            }
        }

        function openRealisasiAnggaranModal(mode, idx = -1) {
            if (DB.renstraIndikatorKinerja.length === 0) {
                showToast('Belum ada Indikator Kinerja Renstra terinput!', 'error');
                return;
            }
            const modal = document.getElementById('realisasiAnggaranModal');

            if (mode === 'edit' && idx !== -1) {
                const item = DB.realisasiAnggaranAdmin[idx];
                document.getElementById('raTahun').value = item.tahun;
                document.getElementById('raTriwulan').value = item.triwulan;
                document.getElementById('raIndikatorId').value = item.indikatorId;
                document.getElementById('raNilai').value = item.realisasiAnggaran;
            }
        }
        function closeRealisasiAnggaranModal() { document.getElementById('realisasiAnggaranModal').classList.remove('flex'); document.getElementById('realisasiAnggaranModal').classList.add('hidden'); }

        async function saveRealisasiAnggaran(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editRaIndex').value);
            const raObj = {
                id: idx !== -1 ? DB.realisasiAnggaranAdmin[idx].id : 'ra_' + Date.now(),
                tahun: document.getElementById('raTahun').value,
                triwulan: document.getElementById('raTriwulan').value,
                indikatorId: document.getElementById('raIndikatorId').value,
                realisasiAnggaran: parseFloat(document.getElementById('raNilai').value) || 0
            };
            if (idx !== -1) DB.realisasiAnggaranAdmin[idx] = raObj;
            else DB.realisasiAnggaranAdmin.push(raObj);
            await saveToMySQL();
            closeRealisasiAnggaranModal();
            showToast('Realisasi anggaran berhasil disimpan!');
            renderRenstraView(document.getElementById('mainContent'));
        }

        async function deleteRealisasiAnggaran(idx) {
            DB.realisasiAnggaranAdmin.splice(idx, 1);
            await saveToMySQL();
            renderRenstraView(document.getElementById('mainContent'));
        }

        async function saveRenstra(e) {
            e.preventDefault();
            const isEdit = editingRenstraIndex !== -1;
            if (currentRenstraType === 'tujuanKemenperin') {
                const data = { id: isEdit ? DB.renstraTujuanKemenperin[editingRenstraIndex].id : 'tk_' + Date.now(), kode: document.getElementById('r_kode').value, sasaran: document.getElementById('r_sasaran').value };
                if (isEdit) DB.renstraTujuanKemenperin[editingRenstraIndex] = data;
                else DB.renstraTujuanKemenperin.push(data);
            } else if (currentRenstraType === 'bpsdmi') {
                const data = { id: isEdit ? DB.renstraBPSDMI[editingRenstraIndex].id : 'bp_' + Date.now(), tujuanKemenperinId: document.getElementById('r_parent').value, kode: document.getElementById('r_kode').value, sasaran: document.getElementById('r_sasaran').value };
                if (isEdit) DB.renstraBPSDMI[editingRenstraIndex] = data;
                else DB.renstraBPSDMI.push(data);
            } else if (currentRenstraType === 'sasaranKinerja') {
                const data = { id: isEdit ? DB.renstraSasaranKinerja[editingRenstraIndex].id : 'sk_' + Date.now(), bpsdmiId: document.getElementById('r_parent').value, kode: document.getElementById('r_kode').value, sasaranKinerja: document.getElementById('r_sasaranKinerja').value };
                if (isEdit) DB.renstraSasaranKinerja[editingRenstraIndex] = data;
                else DB.renstraSasaranKinerja.push(data);
            } else if (currentRenstraType === 'indikatorKinerja') {
                const data = {
                    id: isEdit ? DB.renstraIndikatorKinerja[editingRenstraIndex].id : 'ik_' + Date.now(),
                    sasaranKinerjaId: document.getElementById('r_parent').value,
                    kodeIndikator: document.getElementById('r_kodeIndikator').value,
                    namaIndikator: document.getElementById('r_namaIndikator').value,
                    satuan: document.getElementById('r_satuan').value,
                    target2025: parseFloat(document.getElementById('r_2025').value),
                    target2026: parseFloat(document.getElementById('r_2026').value),
                    target2027: parseFloat(document.getElementById('r_2027').value),
                    target2028: parseFloat(document.getElementById('r_2028').value),
                    target2029: parseFloat(document.getElementById('r_2029').value),
                    anggaran2025: parseFloat(document.getElementById('r_ang2025').value) || 0,
                    anggaran2026: parseFloat(document.getElementById('r_ang2026').value) || 0,
                    anggaran2027: parseFloat(document.getElementById('r_ang2027').value) || 0,
                    anggaran2028: parseFloat(document.getElementById('r_ang2028').value) || 0,
                    anggaran2029: parseFloat(document.getElementById('r_ang2029').value) || 0
                };
                if (isEdit) DB.renstraIndikatorKinerja[editingRenstraIndex] = data;
                else DB.renstraIndikatorKinerja.push(data);
            }
            await saveToMySQL();
            closeRenstraModal();
            showToast('Data Renstra berhasil disimpan!');
            renderRenstraView(document.getElementById('mainContent'));
        }

        async function deleteRenstra(type, idx) {
            if (!confirm('Hapus data Renstra ini?')) return;
            if (type === 'tujuanKemenperin') DB.renstraTujuanKemenperin.splice(idx, 1);
            else if (type === 'bpsdmi') DB.renstraBPSDMI.splice(idx, 1);
            else if (type === 'sasaranKinerja') DB.renstraSasaranKinerja.splice(idx, 1);
            else if (type === 'indikatorKinerja') DB.renstraIndikatorKinerja.splice(idx, 1);
            await saveToMySQL();
            renderRenstraView(document.getElementById('mainContent'));
        }

                kategori: document.getElementById('docKategori').value,
                tahun: document.getElementById('docTahun').value,

        function updateDirRenstraOptions(tahun) {
            const sel = document.getElementById('dirIndikatorRenstra');
            if (!sel) return;
            const matching = DB.renstraIndikatorKinerja || [];
            sel.innerHTML = matching.map(ik => {
                const target = ik['target' + tahun] !== undefined ? ik['target' + tahun] : 100;
                const anggaran = ik['anggaran' + tahun] !== undefined ? ik['anggaran' + tahun] : 0;
                return `<option value="${ik.id}" data-nama="${ik.namaIndikator}" data-satuan="${ik.satuan}" data-target="${target}" data-anggaran="${anggaran}">${ik.kodeIndikator} - ${ik.namaIndikator}</option>`;
            }).join('');
        }

        function updateTimDirRefOptions(tahun) {
            const sel = document.getElementById('timDirRef');
            if (!sel) return;
            const timEl = document.getElementById('timPelaksanaSelect');
            const activeTimKey = timEl ? timEl.value : currentUser.timKey;
            const matching = (DB.cascadingDirektur || []).filter(c => (c.timKeys || []).includes(activeTimKey) && (c.tahun || '2025') === tahun);
            sel.innerHTML = matching.length === 0 ? '<option value="">Belum ada indikator pada tahun ini</option>' : matching.map(c => `<option value="${c.target}">${c.target}</option>`).join('');
        }

        async function saveCascadingDir(e) {
            e.preventDefault();
            const tahun = document.getElementById('dirTahunTarget').value;
            const sel = document.getElementById('dirIndikatorRenstra');
            const opt = sel.options[sel.selectedIndex];
            const checked = Array.from(document.querySelectorAll('input[name="timCheck"]:checked')).map(el => el.value);
            if (checked.length === 0) {
                showToast('Pilih minimal 1 Tim Kerja!', 'error');
                return;
            }
            DB.cascadingDirektur.push({
                id: 'cd_' + Date.now(),
                indikatorId: sel.value,
                tahun: tahun,
                target: opt.getAttribute('data-nama'),
                targetVal: parseFloat(opt.getAttribute('data-target')) || 100,
                satuan: opt.getAttribute('data-satuan') || '%',
                anggaran: parseFloat(opt.getAttribute('data-anggaran')) || 0,
                timKeys: checked,
                status: 'Aktif'
            });
            await saveToMySQL();
            document.getElementById('cascadingDirModal').classList.add('hidden');
            showToast('Cascading Direktur disimpan!');

                unit: document.getElementById('risUnit').value,
                timKey: document.getElementById('risTimKey').value,
                targetDirektur: document.getElementById('risIndikator').value,
                pernyataan: document.getElementById('risPernyataan').value.trim(),
                dampak: document.getElementById('risDampak').value.trim(),
                prob1: p1, damp1: d1, skor1: pre.skor, warnaPre: pre.warna,
                mitigasi: document.getElementById('risMitigasi').value.trim(),
                prob2: p2, damp2: d2, skor2: res.skor, warnaResidu: res.warna
            };
            if (idx !== -1) DB.risiko[idx] = obj;
            else DB.risiko.push(obj);
            await saveToMySQL();
            document.getElementById('risikoModal').classList.add('hidden');
            showToast('Risiko disimpan!');
            renderRisikoView(document.getElementById('mainContent'));
        }

        async function deleteRisiko(idx) {
            if (!confirm('Hapus risiko ini?')) return;
            DB.risiko.splice(idx, 1);
            await saveToMySQL();
            renderRisikoView(document.getElementById('mainContent'));
        }

        // ============================================================================
        // 11. MONITORING TINDAK LANJUT VIEW
        // ============================================================================
        function renderTindakLanjutMonitorView(container) {
            document.getElementById('pageTitle').innerText = 'Monitoring Tindak Lanjut';
            const list = (DB.capaian || []).map((c, idx) => ({ ...c, _origIdx: idx }));

            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
                    <h3 class="font-bold text-slate-900 text-base">Monitoring Rencana Tindak Lanjut (RTL)</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-slate-50 font-semibold border-b">
                                <tr>
                                    <th class="p-3">Periode & Unit</th>
                                    <th class="p-3">Indikator Kinerja</th>
                                    <th class="p-3">Permasalahan</th>
                                    <th class="p-3">Rencana Tindak Lanjut</th>
                                    <th class="p-3 text-center">Status TL</th>
                                    <th class="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                ${list.length === 0 ? `<tr><td colspan="6" class="p-6 text-center text-slate-400">Belum ada data tindak lanjut.</td></tr>` : list.map(c => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-3 font-bold">${c.tahun} (${c.triwulan}) -${c.unit}</td>
                                        <td class="p-3 font-semibold">${c.targetDirektur}</td>
                                        <td class="p-3 text-rose-600">${c.permasalahan || '-'}</td>
                                        <td class="p-3 text-emerald-700">${c.tindakLanjut || '-'}</td>
                                        <td class="p-3 text-center"><span class="px-2 py-1 rounded-full text-[10px] font-bold ${c.statusTL === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${c.statusTL || 'Proses'}</span></td>
                                        <td class="p-3 text-center"><button onclick="toggleStatusTL(${c._origIdx})" class="px-3 py-1 bg-blue-50 text-blue-700 rounded font-semibold">Ubah Status</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        async function toggleStatusTL(idx) {
            if (!DB.capaian[idx]) return;
            DB.capaian[idx].statusTL = DB.capaian[idx].statusTL === 'Selesai' ? 'Proses' : 'Selesai';
            await saveToMySQL();
            renderTindakLanjutMonitorView(document.getElementById('mainContent'));
        }

        // ============================================================================
        // 12. ADMIN VIEW
        // ============================================================================
        function renderAdminView(container) {
            document.getElementById('pageTitle').innerText = 'Manajemen Pejabat & User';
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                        <h3 class="font-bold text-slate-900 text-base">Daftar Akun Pejabat & User Sistem</h3>
                        <button onclick="openUserModal()" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-xl text-xs shadow">Tambah User</button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-slate-50 font-semibold border-b">
                                <tr>
                                    <th class="p-3">Nama Pejabat</th>
                                    <th class="p-3">Username</th>
                                    <th class="p-3">Password</th>
                                    <th class="p-3">Role</th>
                                    <th class="p-3">Unit</th>
                                    <th class="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                ${(DB.users || []).map((u, idx) => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-3 font-bold">${u.name}</td>
                                        <td class="p-3 font-mono text-blue-700">${u.username}</td>
                                        <td class="p-3 font-mono">${u.password}</td>
                                        <td class="p-3 uppercase font-semibold">${u.role}</td>
                                        <td class="p-3">${u.unit}</td>
                                        <td class="p-3 text-center space-x-1">
                                            <button onclick="openUserModal(${idx})" class="p-1.5 bg-blue-100 text-blue-700 rounded"><i class="fa-solid fa-pen"></i></button>
                                            ${u.username !== 'admin' ? `<button onclick="deleteUser(${idx})" class="p-1.5 bg-rose-100 text-rose-600 rounded"><i class="fa-solid fa-trash"></i></button>` : ''}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="userModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-3">
                        <h3 class="font-bold text-slate-900 text-base border-b pb-3">Form User</h3>
                        <form onsubmit="saveUser(event)" class="space-y-3 text-sm">
                            <input type="hidden" id="editUserIdx" value="-1">
                            <div><label class="block font-semibold mb-1">Nama Pejabat</label><input type="text" id="usrName" required class="w-full p-2.5 bg-slate-50 border rounded-xl"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block font-semibold mb-1">Username</label><input type="text" id="usrUsername" required class="w-full p-2.5 bg-slate-50 border rounded-xl"></div>
                                <div><label class="block font-semibold mb-1">Password</label><input type="text" id="usrPassword" required value="123" class="w-full p-2.5 bg-slate-50 border rounded-xl"></div>
                            </div>
                            <div><label class="block font-semibold mb-1">Role</label><select id="usrRole" class="w-full p-2.5 bg-slate-50 border rounded-xl"><option value="ketua_unit">Ketua Unit</option><option value="tim_kerja">Ketua Tim Kerja</option><option value="direktur">Direktur</option><option value="admin">Admin</option></select></div>
                            <div><label class="block font-semibold mb-1">Unit</label><input type="text" id="usrUnit" required class="w-full p-2.5 bg-slate-50 border rounded-xl"></div>
                            <div class="flex justify-end space-x-2 pt-2">
                                <button type="button" onclick="document.getElementById('userModal').classList.add('hidden')" class="px-4 py-2 bg-slate-200 rounded-xl">Batal</button>
                                <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-xl">Simpan</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function openUserModal(idx = -1) {
            const m = document.getElementById('userModal');
            m.classList.remove('hidden'); m.classList.add('flex');
            document.getElementById('editUserIdx').value = idx;
            if (idx !== -1 && DB.users[idx]) {
                const u = DB.users[idx];
                document.getElementById('usrName').value = u.name;
                document.getElementById('usrUsername').value = u.username;
                document.getElementById('usrPassword').value = u.password;
                document.getElementById('usrRole').value = u.role;
                document.getElementById('usrUnit').value = u.unit;
            }
        }

        async function saveUser(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editUserIdx').value);
            const obj = {
                id: idx !== -1 ? DB.users[idx].id : 'u_' + Date.now(),
                name: document.getElementById('usrName').value.trim(),
                username: document.getElementById('usrUsername').value.trim(),
                password: document.getElementById('usrPassword').value.trim(),
                role: document.getElementById('usrRole').value,
                unit: document.getElementById('usrUnit').value.trim()
            };
            if (idx !== -1) DB.users[idx] = obj;
            else DB.users.push(obj);
            await saveToMySQL();
            document.getElementById('userModal').classList.add('hidden');
            renderAdminView(document.getElementById('mainContent'));
        }

        async function deleteUser(idx) {
            if (!confirm('Hapus user ini?')) return;
            DB.users.splice(idx, 1);
            await saveToMySQL();
            renderAdminView(document.getElementById('mainContent'));
        }

        // ============================================================================
        // 13. LAPORAN PDF VIEW
        // ============================================================================
        function renderLaporanView(container) {
            document.getElementById('pageTitle').innerText = 'Ekspor & Download PDF';
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center no-print">
                        <h3 class="font-bold text-slate-900 text-base">Cetak Laporan Resmi Kinerja & Risiko</h3>
                        <button onclick="window.print()" class="px-5 py-2.5 bg-rose-600 text-white font-semibold rounded-xl text-sm shadow">Cetak / Download PDF</button>
                    </div>
                    <div id="printableArea" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6 text-xs">
                        <div class="text-center border-b-2 border-slate-800 pb-4">
                            <h2 class="text-base font-bold uppercase">KEMENTERIAN PERINDUSTRIAN REPUBLIK INDONESIA</h2>
                            <h3 class="text-sm font-bold uppercase text-blue-800">POLITEKNIK INDUSTRI PETROKIMIA BANTEN</h3>
                            <p class="text-slate-600 mt-1">Laporan Capaian Kinerja & Manajemen Risiko (Ki-Jaro)</p>
                        </div>
                        <div>
                            <h4 class="font-bold mb-2">I. Rekapitulasi Capaian Kinerja</h4>
                            <table class="w-full border-collapse border border-slate-300">
                                <thead class="bg-slate-100">
                                    <tr>
                                        <th class="border border-slate-300 p-2">Periode</th>
                                        <th class="border border-slate-300 p-2">Unit</th>
                                        <th class="border border-slate-300 p-2">Indikator</th>
                                        <th class="border border-slate-300 p-2 text-center">Realisasi</th>
                                        <th class="border border-slate-300 p-2">Kendala & RTL</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${(DB.capaian || []).length === 0 ? `<tr><td colspan="5" class="p-4 text-center">Belum ada data.</td></tr>` : DB.capaian.map(c => `
                                        <tr>
                                            <td class="border border-slate-300 p-2">${c.tahun} -${c.triwulan}</td>
                                            <td class="border border-slate-300 p-2">${c.unit}</td>
                                            <td class="border border-slate-300 p-2">${c.targetDirektur}</td>
                                            <td class="border border-slate-300 p-2 text-center font-bold">${c.realisasi}</td>
                                            <td class="border border-slate-300 p-2">${c.permasalahan \vert{}\vert{} '-'} /${c.tindakLanjut || '-'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================================
        // 14. INSTANT STARTUP
        // ============================================================================
        (function startImmediately() {
            try {
                loadFromLocalCache();
                DB.users = ensureDefaultUsersExist(DB.users);

                const savedUserRaw = localStorage.getItem('ki_jaro_user');
                if (savedUserRaw) {
                    const parsed = JSON.parse(savedUserRaw);
                    if (parsed && parsed.username) {
                        currentUser = DB.users.find(u => String(u.username).toLowerCase() === String(parsed.username).toLowerCase()) || parsed;
                        if (currentUser && currentUser.name) {
                            renderDashboardLayout();
                        }
                    }
                }

                // Sinkronisasi background tanpa pernah memblokir tampilan
                loadDataFromMySQL().then((updated) => {
                    DB.users = ensureDefaultUsersExist(DB.users);
                    if (updated && currentUser && currentUser.name) {
                        switchTab(activeTab);
                    }
                });
            } catch (err) {
                console.error("Init Warning:", err);
            }
        })();
    </script>
</body>
</html>
