        const LS_DB_KEY = 'ki_jaro_master_db';

        function sanitizeAndMergeDB(incoming) {
            if (!incoming || typeof incoming !== 'object') return;

            // Jika incoming terbungkus di dalam properti .value atau .data lagi
            if (incoming.value && typeof incoming.value === 'object' && Array.isArray(incoming.value.users)) {
                incoming = incoming.value;
            } else if (incoming.data && typeof incoming.data === 'object' && Array.isArray(incoming.data.users)) {
                incoming = incoming.data;
            }

            if (Array.isArray(incoming.users) && incoming.users.length > 0) {
                DB.users = incoming.users;
            } else if (!Array.isArray(DB.users) || DB.users.length === 0) {
                DB.users = JSON.parse(JSON.stringify(DEFAULT_USERS));
            }

            DB.timKerjaList = (Array.isArray(incoming.timKerjaList) && incoming.timKerjaList.length > 0) ? incoming.timKerjaList : [...DEFAULT_TIM_LIST];
            DB.unitList = (Array.isArray(incoming.unitList) && incoming.unitList.length > 0) ? incoming.unitList : [...DEFAULT_UNIT_LIST];

            const arrayFields = [
                'renstraTujuanKemenperin', 'renstraBPSDMI', 'renstraSasaranKinerja', 'renstraIndikatorKinerja',
                'cascadingDirektur', 'cascadingTim', 'capaian', 'risiko', 'realisasiAnggaranAdmin'
            ];
            arrayFields.forEach(field => {
                if (Array.isArray(incoming[field])) {
                    DB[field] = incoming[field];
                } else if (!Array.isArray(DB[field])) {
                    DB[field] = [];
                }
            });

            if (Array.isArray(incoming.dokumenPerencanaan)) {
                DB.dokumenPerencanaan = incoming.dokumenPerencanaan;
            }
            if (incoming.spreadsheetUrl) {
                DB.spreadsheetUrl = incoming.spreadsheetUrl;
            }
            if (incoming.lastUpdated) {
                DB.lastUpdated = Number(incoming.lastUpdated) || 0;
            }
        }

        function countTotalRecords(obj) {
            if (!obj || typeof obj !== 'object') return 0;
            return (
                (Array.isArray(obj.renstraTujuanKemenperin) ? obj.renstraTujuanKemenperin.length : 0) +
                (Array.isArray(obj.renstraBPSDMI) ? obj.renstraBPSDMI.length : 0) +
                (Array.isArray(obj.renstraSasaranKinerja) ? obj.renstraSasaranKinerja.length : 0) +
                (Array.isArray(obj.renstraIndikatorKinerja) ? obj.renstraIndikatorKinerja.length : 0) +
                (Array.isArray(obj.cascadingDirektur) ? obj.cascadingDirektur.length : 0) +
                (Array.isArray(obj.cascadingTim) ? obj.cascadingTim.length : 0) +
                (Array.isArray(obj.capaian) ? obj.capaian.length : 0) +
                (Array.isArray(obj.risiko) ? obj.risiko.length : 0) +
                (Array.isArray(obj.realisasiAnggaranAdmin) ? obj.realisasiAnggaranAdmin.length : 0)
            );
        }

        function loadFromLocalCache() {
            try {
                const raw = localStorage.getItem(LS_DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    sanitizeAndMergeDB(parsed);
                    return parsed;
                }
            } catch (e) {
                console.warn("Gagal membaca cache lokal:", e);
            }
            return null;
        }

        function saveToLocalCache() {
            try {
                localStorage.setItem(LS_DB_KEY, JSON.stringify(DB));
            } catch (e) {
                console.warn("Gagal menyimpan ke cache lokal:", e);
            }
        }

        async function fetchWithTimeout(url, options = {}, timeoutMs = 4500) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        // === SINKRONISASI OTOMATIS & AMAN KE MYSQL ===
        async function loadDataFromMySQL() {
            const localCopy = loadFromLocalCache();
            const localRecords = countTotalRecords(localCopy);
            const localTime = localCopy && localCopy.lastUpdated ? Number(localCopy.lastUpdated) : 0;

            try {
                const response = await fetchWithTimeout('/api/load-state/main_kijaro', {
                    method: 'GET',
                    headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
                }, 4500);

                if (response.ok) {
                    const result = await response.json();
                    let serverData = null;

                    if (result && result.data) {
                        serverData = typeof result.data === 'string' ? JSON.parse(result.data) : result.data;
                    } else if (result && result.value) {
                        serverData = typeof result.value === 'string' ? JSON.parse(result.value) : result.value;
                    } else if (result && Array.isArray(result.users)) {
                        serverData = result;
                    }

                    if (serverData && typeof serverData === 'object') {
                        const serverRecords = countTotalRecords(serverData);
                        const serverTime = Number(serverData.lastUpdated || 0);

                        if (serverRecords > 0 || serverTime >= localTime) {
                            sanitizeAndMergeDB(serverData);
                            saveToLocalCache();
                        } else if (localRecords > 0 && serverRecords === 0) {
                            // Jika di browser ada data tapi di MySQL masih kosong, otomatis kirim ke MySQL
                            await pushStateToMySQL();
                        }
                        isServerConnected = true;
                        updateStatusIndicator();
                        return true;
                    } else if (localRecords > 0) {
                        await pushStateToMySQL();
                        isServerConnected = true;
                        updateStatusIndicator();
                        return true;
                    }
                }
            } catch (e) {
                console.warn("Info Koneksi MySQL:", e.message);
            }

            isServerConnected = false;
            updateStatusIndicator();
            return false;
        }

        async function pushStateToMySQL() {
            const res = await fetchWithTimeout('/api/save-state', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    key: 'main_kijaro',
                    value: DB
                })
            }, 5000);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const json = await res.json();
            isServerConnected = true;
            updateStatusIndicator();
            return json;
        }

        async function saveToMySQL() {
            DB.lastUpdated = Date.now();
            // 1. Kunci ke LocalStorage agar di-reload tidak pernah hilang
            saveToLocalCache();
            // 2. Kirim ke MySQL Server di Dokploy
            try {
                await pushStateToMySQL();
            } catch (e) {
                isServerConnected = false;
                updateStatusIndicator();
                console.error("Gagal menyimpan ke MySQL (Tersimpan aman di Browser):", e);
            }
        }

        function updateStatusIndicator() {
            const el = document.getElementById('dbStatusBadge');
            if (!el) return;
            if (isServerConnected) {
                el.className = "px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-[11px] font-semibold flex items-center space-x-1.5";

            } else {

                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>Mode Lokal Aktif</span>`;
            }

        function calculateSkorRisiko(p, d) {
            const val = (parseInt(p) || 1) * (parseInt(d) || 1);
            let kuadran = '';
            let warna = '';
            let level = '';

            if (val >= 20) { level = 'Sangat Tinggi (5)'; kuadran = 'Kuadran IV (Sangat Tinggi)'; warna = 'bg-rose-600 text-white'; }
            else if (val >= 15) { level = 'Tinggi (4)'; kuadran = 'Kuadran III (Tinggi)'; warna = 'bg-amber-500 text-white'; }
            else if (val >= 12) { level = 'Sedang (3)'; kuadran = 'Kuadran II (Sedang)'; warna = 'bg-yellow-400 text-slate-900'; }
            else if (val >= 7) { level = 'Rendah (2)'; kuadran = 'Kuadran I (Rendah)'; warna = 'bg-emerald-500 text-white'; }
            else { level = 'Sangat Rendah (1)'; kuadran = 'Kuadran I (Sangat Rendah)'; warna = 'bg-blue-500 text-white'; }

            return { skor: val, level, kuadran, warna };
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-white shadow-lg flex items-center space-x-3 transition-all transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info'} text-lg"></i><span class="text-sm font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

                    el.className = 'nav-link flex items-center space-x-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-800 text-slate-400 hover:text-white';
                }
            });

            const content = document.getElementById('mainContent');
            if (!content) return;

            try {
                if (tab === 'dashboard') renderDashboardView(content);
                else if (tab === 'renstra') renderRenstraView(content);
                else if (tab === 'dokumen') renderDokumenView(content);
                else if (tab === 'cascading') renderCascadingView(content);
                else if (tab === 'capaian') renderCapaianView(content);

                else if (tab === 'admin') renderAdminView(content);

                console.error("Render View Error:", err);
                content.innerHTML = `<div class="p-6 bg-rose-50 border border-rose-200 rounded-2xl text-rose-700 text-sm">Terjadi kesalahan tampilan: ${err.message}</div>`;
            }

            if (mode === 'edit' && idx !== -1) {
                document.getElementById('raModalTitle').innerText = 'Edit Realisasi Anggaran Riil';

                document.getElementById('raTahun').value = item.tahun;
                document.getElementById('raTriwulan').value = item.triwulan;
                document.getElementById('raIndikatorId').value = item.indikatorId;
                document.getElementById('raNilai').value = item.realisasiAnggaran;
            } else {
                document.getElementById('raModalTitle').innerText = 'Input Realisasi Anggaran Riil';
                document.getElementById('editRaIndex').value = -1;
                document.getElementById('raNilai').value = '45000000';

        async function saveRealisasiAnggaran(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editRaIndex').value);
            const tahun = document.getElementById('raTahun').value;
            const triwulan = document.getElementById('raTriwulan').value;
            const indikatorId = document.getElementById('raIndikatorId').value;
            const realisasiAnggaran = parseFloat(document.getElementById('raNilai').value) || 0;

            const raObj = {
                id: idx !== -1 ? DB.realisasiAnggaranAdmin[idx].id : 'ra_' + Date.now(),
                tahun,
                triwulan,
                indikatorId,
                realisasiAnggaran
            };

            if (idx !== -1) {
                DB.realisasiAnggaranAdmin[idx] = raObj;
                showToast('Realisasi anggaran berhasil diperbarui!');
            } else {
                DB.realisasiAnggaranAdmin.push(raObj);
                showToast('Realisasi anggaran riil berhasil disimpan!');
            }

            await saveToMySQL();
            closeRealisasiAnggaranModal();
            renderRenstraView(document.getElementById('mainContent'));
        }

        async function deleteRealisasiAnggaran(idx) {
            DB.realisasiAnggaranAdmin.splice(idx, 1);
            await saveToMySQL();
            showToast('Realisasi anggaran dihapus.', 'info');
            renderRenstraView(document.getElementById('mainContent'));
        }

        async function saveRenstra(e) {
            e.preventDefault();
            const isEdit = editingRenstraIndex !== -1;

            if (currentRenstraType === 'tujuanKemenperin') {
                const data = { id: isEdit ? DB.renstraTujuanKemenperin[editingRenstraIndex].id : 'tk_' + Date.now(), kode: document.getElementById('r_kode').value, sasaran: document.getElementById('r_sasaran').value };
                if (isEdit) DB.renstraTujuanKemenperin[editingRenstraIndex] = data;
                else DB.renstraTujuanKemenperin.push(data);
            } else if (currentRenstraType === 'bpsdmi') {
                const data = { id: isEdit ? DB.renstraBPSDMI[editingRenstraIndex].id : 'bp_' + Date.now(), tujuanKemenperinId: document.getElementById('r_parent').value, kode: document.getElementById('r_kode').value, sasaran: document.getElementById('r_sasaran').value };
                if (isEdit) DB.renstraBPSDMI[editingRenstraIndex] = data;
                else DB.renstraBPSDMI.push(data);
            } else if (currentRenstraType === 'sasaranKinerja') {
                const data = { id: isEdit ? DB.renstraSasaranKinerja[editingRenstraIndex].id : 'sk_' + Date.now(), bpsdmiId: document.getElementById('r_parent').value, kode: document.getElementById('r_kode').value, sasaranKinerja: document.getElementById('r_sasaranKinerja').value };
                if (isEdit) DB.renstraSasaranKinerja[editingRenstraIndex] = data;
                else DB.renstraSasaranKinerja.push(data);
            } else if (currentRenstraType === 'indikatorKinerja') {
                const data = {
                    id: isEdit ? DB.renstraIndikatorKinerja[editingRenstraIndex].id : 'ik_' + Date.now(),
                    sasaranKinerjaId: document.getElementById('r_parent').value,
                    kodeIndikator: document.getElementById('r_kodeIndikator').value,
                    namaIndikator: document.getElementById('r_namaIndikator').value,
                    satuan: document.getElementById('r_satuan').value,
                    target2025: parseFloat(document.getElementById('r_2025').value),
                    target2026: parseFloat(document.getElementById('r_2026').value),
                    target2027: parseFloat(document.getElementById('r_2027').value),
                    target2028: parseFloat(document.getElementById('r_2028').value),
                    target2029: parseFloat(document.getElementById('r_2029').value),
                    anggaran2025: parseFloat(document.getElementById('r_ang2025').value) || 0,
                    anggaran2026: parseFloat(document.getElementById('r_ang2026').value) || 0,
                    anggaran2027: parseFloat(document.getElementById('r_ang2027').value) || 0,
                    anggaran2028: parseFloat(document.getElementById('r_ang2028').value) || 0,
                    anggaran2029: parseFloat(document.getElementById('r_ang2029').value) || 0
                };
                if (isEdit) DB.renstraIndikatorKinerja[editingRenstraIndex] = data;
                else DB.renstraIndikatorKinerja.push(data);
            }
            await saveToMySQL();
            closeRenstraModal();
            showToast('Data Renstra berhasil disimpan!');
            renderRenstraView(document.getElementById('mainContent'));
        }

        async function deleteRenstra(type, idx) {
            let canDelete = true;
            if (type === 'tujuanKemenperin') {
                const item = DB.renstraTujuanKemenperin[idx];
                if (DB.renstraBPSDMI.some(b => b.tujuanKemenperinId === item.id)) canDelete = false;
            } else if (type === 'bpsdmi') {
                const item = DB.renstraBPSDMI[idx];
                if (DB.renstraSasaranKinerja.some(s => s.bpsdmiId === item.id)) canDelete = false;
            } else if (type === 'sasaranKinerja') {
                const item = DB.renstraSasaranKinerja[idx];
                if (DB.renstraIndikatorKinerja.some(i => i.sasaranKinerjaId === item.id)) canDelete = false;
            } else if (type === 'indikatorKinerja') {
                const item = DB.renstraIndikatorKinerja[idx];
                if (DB.cascadingDirektur.some(c => c.indikatorId === item.id)) canDelete = false;
            }

            if (!canDelete) {
                showToast('Data ini tidak dapat dihapus karena sudah digunakan dalam cascading!', 'error');
                return;
            }

            if (confirm('Apakah Anda yakin ingin menghapus data Renstra ini?')) {
                if (type === 'tujuanKemenperin') DB.renstraTujuanKemenperin.splice(idx, 1);
                else if (type === 'bpsdmi') DB.renstraBPSDMI.splice(idx, 1);
                else if (type === 'sasaranKinerja') DB.renstraSasaranKinerja.splice(idx, 1);
                else if (type === 'indikatorKinerja') DB.renstraIndikatorKinerja.splice(idx, 1);
                
                await saveToMySQL();
                showToast('Data berhasil dihapus.', 'info');
                renderRenstraView(document.getElementById('mainContent'));
            }
        }

        function getSortedDokumen() {
            const sortBy = document.getElementById('sortDokumenBy') ? document.getElementById('sortDokumenBy').value : 'nama';
            let docs = (DB.dokumenPerencanaan || []).map((d, idx) => ({ ...d, _origIdx: idx }));
            if (sortBy === 'nama') docs.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
            else if (sortBy === 'tahun') docs.sort((a, b) => (a.tahun || '').localeCompare(b.tahun || ''));
            else if (sortBy === 'kategori') docs.sort((a, b) => (a.kategori || '').localeCompare(b.kategori || ''));
            return docs;
        }

        function openDokumenModal() { document.getElementById('dokumenModal').classList.remove('hidden'); document.getElementById('dokumenModal').classList.add('flex'); }
        function closeDokumenModal() { document.getElementById('dokumenModal').classList.remove('flex'); document.getElementById('dokumenModal').classList.add('hidden'); }
        
        async function saveDokumen(e) {
            e.preventDefault();
            DB.dokumenPerencanaan.push({
                nama: document.getElementById('docNama').value,
                kategori: document.getElementById('docKategori').value,
                tahun: document.getElementById('docTahun').value,
                link: document.getElementById('docLink').value
            });
            await saveToMySQL();
            closeDokumenModal();
            showToast('Dokumen perencanaan berhasil ditambahkan!');
            renderDokumenView(document.getElementById('mainContent'));
        }

        async function deleteDokumen(idx) {
            DB.dokumenPerencanaan.splice(idx, 1);
            await saveToMySQL();
            showToast('Dokumen dihapus.', 'info');
            renderDokumenView(document.getElementById('mainContent'));
        }

        // ============================================================================
        // 7. DASHBOARD VIEW

        function renderDashboardView(container) {
            document.getElementById('pageTitle').innerText = 'Dashboard Capaian Kinerja & Peta Risiko';
            
            let validCapaian = (DB.capaian || []).filter(c => c.status === 'Valid');
            if (filterDashboardTahun !== 'Semua') validCapaian = validCapaian.filter(c => c.tahun === filterDashboardTahun);
            if (filterDashboardTriwulan !== 'Semua') validCapaian = validCapaian.filter(c => c.triwulan === filterDashboardTriwulan);
            if (filterDashboardTim !== 'Semua') validCapaian = validCapaian.filter(c => c.timKey === filterDashboardTim);
            if (filterDashboardUnit !== 'Semua') validCapaian = validCapaian.filter(c => c.unit === filterDashboardUnit);

            let filteredCascading = DB.cascadingDirektur || [];
            if (filterDashboardTahun !== 'Semua') filteredCascading = filteredCascading.filter(c => c.tahun === filterDashboardTahun);
            if (filterDashboardTim !== 'Semua') filteredCascading = filteredCascading.filter(c => (c.timKeys || []).includes(filterDashboardTim));

            let totalValidIndikator = filteredCascading.length;
            let achievedCount = 0;
            filteredCascading.forEach(cd => {
                let matched = validCapaian.filter(c => c.targetDirektur === cd.target && c.tahun === cd.tahun);
                if (filterDashboardTriwulan !== 'Semua') matched = matched.filter(c => c.triwulan === filterDashboardTriwulan);
                if (matched.length > 0) {
                    const avgReal = matched.reduce((a,b)=>a+Number(b.realisasi || 0),0)/matched.length;
                    const targetVal = cd.targetVal !== undefined ? cd.targetVal : 100;
                    if (avgReal >= targetVal) achievedCount++;
                }
            });

            let myFilteredCascading = filteredCascading;
            let myValidCapaian = validCapaian;
            if (currentUser.role === 'ketua_unit') {
                myValidCapaian = validCapaian.filter(c => c.unit === currentUser.unit);
                const assignedTargets = (DB.cascadingTim || []).filter(ct => (ct.unitTargets || []).includes(currentUser.unit)).map(ct => ct.targetDirektur);
                myFilteredCascading = filteredCascading.filter(cd => assignedTargets.includes(cd.target));
            } else if (currentUser.role === 'tim_kerja') {
                myValidCapaian = validCapaian.filter(c => c.timKey === currentUser.timKey);
                myFilteredCascading = filteredCascading.filter(cd => (cd.timKeys || []).includes(currentUser.timKey));
            }
            
            let roleAchievedCount = 0;
            let roleTotalIndikator = myFilteredCascading.length;
            myFilteredCascading.forEach(cd => {
                let matched = myValidCapaian.filter(c => c.targetDirektur === cd.target && c.tahun === cd.tahun);
                if (filterDashboardTriwulan !== 'Semua') matched = matched.filter(c => c.triwulan === filterDashboardTriwulan);
                if (matched.length > 0) {
                    const avgReal = matched.reduce((a,b)=>a+Number(b.realisasi || 0),0)/matched.length;
                    const targetVal = cd.targetVal !== undefined ? cd.targetVal : 100;
                    if (avgReal >= targetVal) roleAchievedCount++;
                }

            let effectiveCount = 0;
            let efficientCount = 0;
            let filteredRealisasiAdmin = DB.realisasiAnggaranAdmin || [];
            if (filterDashboardTahun !== 'Semua') filteredRealisasiAdmin = filteredRealisasiAdmin.filter(ra => ra.tahun === filterDashboardTahun);
            if (filterDashboardTriwulan !== 'Semua') filteredRealisasiAdmin = filteredRealisasiAdmin.filter(ra => ra.triwulan === filterDashboardTriwulan);
            filteredRealisasiAdmin.forEach(ra => {
                const ik = DB.renstraIndikatorKinerja.find(x => x.id === ra.indikatorId);
                const pagu = ik ? (ik['anggaran' + ra.tahun] || 100000000) : 100000000;
                const realAnggaran = ra.realisasiAnggaran;
                const pAnggaran = pagu > 0 ? (realAnggaran / pagu) * 100 : 0;
                const match = DB.capaian.filter(c => ik && c.targetDirektur === ik.namaIndikator && c.tahun === ra.tahun && c.triwulan === ra.triwulan && c.status === 'Valid');
                const pOutput = match.length > 0 ? (match.reduce((a,b)=>a+Number(b.realisasi || 0),0)/match.length) : 0;
                
                const targetVal = ik ? ik['target' + ra.tahun] : 100;
                if (pOutput >= targetVal) effectiveCount++;
                if (pOutput >= pAnggaran) efficientCount++;
            });

            let unitScores = {};
            DB.unitList.forEach(u => {
                if (filterDashboardUnit !== 'Semua' && u !== filterDashboardUnit) return;
                const unitCaps = validCapaian.filter(c => c.unit === u);
                if (unitCaps.length > 0) {
                    const avg = unitCaps.reduce((a,b)=>a+Number(b.realisasi || 0),0)/unitCaps.length;
                    unitScores[u] = avg;
                }
            });
            let sortedUnits = Object.entries(unitScores).sort((a,b) => b[1] - a[1]);
            let bestUnit = sortedUnits.length > 0 ? `${sortedUnits[0][0]} (${sortedUnits[0][1].toFixed(1)}%)` : 'Belum ada data';
            let worstUnit = sortedUnits.length > 0 ? `${sortedUnits[sortedUnits.length-1][0]} (${sortedUnits[sortedUnits.length-1][1].toFixed(1)}%)` : 'Belum ada data';

            let filteredRisiko = DB.risiko || [];
            if (filterDashboardTim !== 'Semua') filteredRisiko = filteredRisiko.filter(r => r.timKey === filterDashboardTim);
            if (filterDashboardUnit !== 'Semua') filteredRisiko = filteredRisiko.filter(r => r.unit === filterDashboardUnit);

            container.innerHTML = `
                <div class="space-y-8">

                        </div>

                            <select onchange="filterDashboardTahun = this.value; renderDashboardView(document.getElementById('mainContent'));" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-semibold">
                                <option value="Semua" ${filterDashboardTahun === 'Semua' ? 'selected' : ''}>Semua Tahun</option>
                                <option value="2025" ${filterDashboardTahun === '2025' ? 'selected' : ''}>2025</option>
                                <option value="2026" ${filterDashboardTahun === '2026' ? 'selected' : ''}>2026</option>
                                <option value="2027" ${filterDashboardTahun === '2027' ? 'selected' : ''}>2027</option>
                                <option value="2028" ${filterDashboardTahun === '2028' ? 'selected' : ''}>2028</option>
                                <option value="2029" ${filterDashboardTahun === '2029' ? 'selected' : ''}>2029</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-600 mb-1">Triwulan / Periode</label>
                            <select onchange="filterDashboardTriwulan = this.value; renderDashboardView(document.getElementById('mainContent'));" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-semibold">
                                <option value="Semua" ${filterDashboardTriwulan === 'Semua' ? 'selected' : ''}>Semua Triwulan</option>
                                <option value="TW 1" ${filterDashboardTriwulan === 'TW 1' ? 'selected' : ''}>Triwulan 1</option>
                                <option value="TW 2" ${filterDashboardTriwulan === 'TW 2' ? 'selected' : ''}>Triwulan 2</option>
                                <option value="TW 3" ${filterDashboardTriwulan === 'TW 3' ? 'selected' : ''}>Triwulan 3</option>
                                <option value="TW 4" ${filterDashboardTriwulan === 'TW 4' ? 'selected' : ''}>Triwulan 4</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-600 mb-1">Tim Kerja</label>
                            <select onchange="filterDashboardTim = this.value; renderDashboardView(document.getElementById('mainContent'));" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-semibold">
                                <option value="Semua" ${filterDashboardTim === 'Semua' ? 'selected' : ''}>Semua Tim Kerja</option>
                                ${DB.timKerjaList.map(t => `<option value="${t}" ${filterDashboardTim === t ? 'selected' : ''}>${t}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-600 mb-1">Prodi / Subbag / Unit</label>
                            <select onchange="filterDashboardUnit = this.value; renderDashboardView(document.getElementById('mainContent'));" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-semibold">
                                <option value="Semua" ${filterDashboardUnit === 'Semua' ? 'selected' : ''}>Semua Unit</option>
                                ${DB.unitList.map(u => `<option value="${u}" ${filterDashboardUnit === u ? 'selected' : ''}>${u}</option>`).join('')}
                            </select>

                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 xl:grid-cols-8 gap-4">

                                <p class="text-[9px] font-semibold text-slate-500 uppercase">Tercapai</p>

                            <div>
                                <p class="text-[9px] font-semibold text-slate-500 uppercase">Tercapai (Role)</p>
                                <h3 class="text-sm font-bold text-slate-900 mt-0.5">${roleAchievedCount} dari ${roleTotalIndikator}</h3>
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-base font-bold shrink-0"><i class="fa-solid fa-check-double"></i></div>

                                <p class="text-[9px] font-semibold text-slate-500 uppercase">Jumlah Efektif</p>

                        </div>

                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-3">

                            <div>
                                <p class="text-[9px] font-semibold text-slate-500 uppercase">Risiko Aktif</p>
                                <h3 class="text-lg font-bold text-slate-900 mt-0.5">${filteredRisiko.length}</h3>
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-xl bg-cyan-50 text-cyan-600 flex items-center justify-center text-base font-bold shrink-0"><i class="fa-solid fa-square-check"></i></div>
                            <div>
                                <p class="text-[9px] font-semibold text-slate-500 uppercase">Target Tercapai</p>
                                <h3 class="text-lg font-bold text-slate-900 mt-0.5">${achievedCount}</h3>
                            </div>
                        </div>
                    </div>

                    ${DB.cascadingDirektur.length === 0 ? `
                        <div class="bg-blue-50 border border-blue-200 p-8 rounded-2xl text-center space-y-4">
                            <i class="fa-solid fa-circle-info text-blue-600 text-4xl"></i>
                            <h3 class="font-bold text-slate-900 text-lg">Mulai Cascading Indikator Kinerja Bertahap</h3>
                            <p class="text-sm text-slate-600 max-w-xl mx-auto">Sistem belum memiliki data cascading. Silakan isi Renstra terlebih dahulu (oleh Admin), lalu login sebagai <strong>Direktur</strong> untuk melakukan cascading ke Ketua Tim Kerja.</p>
                            <button onclick="switchTab('renstra')" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md">Buka Menu Renstra</button>
                        </div>
                    ` : `
                        <!-- Master KPI Table -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                            <div>
                                <h3 class="font-bold text-slate-900 text-base">Tabel Master Indikator Kinerja (Direktur & Unit Terkait)</h3>
                                <p class="text-xs text-slate-500">Memuat indikator kinerja, target, satuan, tim kerja, PIC, % realisasi output, status tercapai/tidak, serta permasalahan</p>
                            </div>
                            <div class="overflow-x-auto">

                                        <tr class="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">

                                            <th class="p-3 text-center">Target</th>

                                            <th class="p-3">Tim Kerja</th>
                                            <th class="p-3">PIC (Unit / Prodi)</th>
                                            <th class="p-3 text-center">% Realisasi Output</th>
                                            <th class="p-3 text-center">Status</th>
                                            <th class="p-3">Permasalahan</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${filteredCascading.map((cd, index) => {
                                            let matchedCap = validCapaian.filter(c => c.targetDirektur === cd.target && c.tahun === cd.tahun && c.status === 'Valid');
                                            const picNames = [...new Set(matchedCap.map(c => c.unit))].join(', ') || 'Belum di-assign';
                                            const timKeyStr = (cd.timKeys || []).join(', ');
                                            const permasalahanStr = matchedCap.map(c => c.permasalahan).filter(Boolean).join('; ') || '-';
                                            const realisasiVal = matchedCap.length > 0 ? matchedCap.reduce((a,b)=>a+Number(b.realisasi || 0),0)/matchedCap.length : 0;
                                            const targetVal = cd.targetVal !== undefined ? cd.targetVal : 100;
                                            const pRealOutput = targetVal > 0 ? ((realisasiVal / targetVal) * 100).toFixed(2) : 0;
                                            const isTercapai = matchedCap.length > 0 && realisasiVal >= targetVal;

                                            return `
                                                <tr class="hover:bg-slate-50 transition-all">
                                                    <td class="p-3 text-center font-semibold text-slate-600">${index + 1}</td>
                                                    <td class="p-3 font-bold text-slate-900">${cd.target}</td>
                                                    <td class="p-3 text-center font-semibold text-blue-700">${targetVal}</td>
                                                    <td class="p-3 text-center"><span class="px-2 py-0.5 bg-slate-100 rounded text-[11px] font-semibold">${cd.satuan || '%'}</span></td>
                                                    <td class="p-3 font-medium text-purple-700">${timKeyStr}</td>
                                                    <td class="p-3 font-medium text-slate-700">${picNames}</td>
                                                    <td class="p-3 text-center font-bold text-emerald-600">${pRealOutput}%</td>
                                                    <td class="p-3 text-center">
                                                        <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold ${isTercapai ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">
                                                            ${isTercapai ? 'Tercapai' : 'Tidak Tercapai'}
                                                        </span>
                                                    </td>
                                                    <td class="p-3 text-slate-500">${permasalahanStr}</td>
                                                </tr>
                                            `;
                                        }).join('')}

        function updateDirRenstraOptions(tahun) {
            const sel = document.getElementById('dirIndikatorRenstra');
            if (!sel) return;
            const matching = DB.renstraIndikatorKinerja || [];
            sel.innerHTML = matching.length === 0 ? '<option value="">Belum ada Indikator Renstra</option>' : matching.map(ik => {
                const target = ik['target' + tahun] !== undefined ? ik['target' + tahun] : 100;
                const anggaran = ik['anggaran' + tahun] !== undefined ? ik['anggaran' + tahun] : 0;
                return `<option value="${ik.id}" data-nama="${ik.namaIndikator}" data-satuan="${ik.satuan}" data-target="${target}" data-anggaran="${anggaran}">${ik.kodeIndikator} - ${ik.namaIndikator} (${ik.satuan})</option>`;

        function updateDirAnggaranPreview() {
            const sel = document.getElementById('dirIndikatorRenstra');
            if (!sel || sel.options.length === 0 || !sel.options[sel.selectedIndex]) return;
            const opt = sel.options[sel.selectedIndex];
            const target = opt.getAttribute('data-target') || '100';
            const anggaran = parseFloat(opt.getAttribute('data-anggaran') || '0');
            document.getElementById('previewTargetVal').innerText = target;
            document.getElementById('previewAnggaranVal').innerText = `Rp ${Number(anggaran).toLocaleString('id-ID')}`;

        function updateTimDirRefOptions(tahun) {

            document.getElementById('cascadingDirModal').classList.remove('hidden'); document.getElementById('cascadingDirModal').classList.add('flex');
            const yrDir = document.getElementById('dirTahunTarget');
            if (yrDir) updateDirRenstraOptions(yrDir.value);

        function closeCascadingDirModal() { document.getElementById('cascadingDirModal').classList.remove('flex'); document.getElementById('cascadingDirModal').classList.add('hidden'); }
        
        async function saveCascadingDir(e) {
            e.preventDefault();
            const tahun = document.getElementById('dirTahunTarget').value;
            const sel = document.getElementById('dirIndikatorRenstra');
            const opt = sel.options[sel.selectedIndex];
            const indikatorName = opt.getAttribute('data-nama');
            const satuan = opt.getAttribute('data-satuan');
            const targetVal = parseFloat(opt.getAttribute('data-target')) || 100;
            const anggaran = parseFloat(opt.getAttribute('data-anggaran')) || 0;
            const checked = Array.from(document.querySelectorAll('input[name="timCheck"]:checked')).map(el => el.value);
            
            if (checked.length === 0) {
                showToast('Pilih minimal 1 Ketua Tim Kerja!', 'error');
                return;
            }

            DB.cascadingDirektur.push({
                id: 'cd_' + Date.now(),
                indikatorId: sel.value,
                tahun: tahun,
                target: indikatorName,
                targetVal: targetVal,
                satuan: satuan,
                anggaran: anggaran,
                timKeys: checked,
                status: 'Aktif'
            });
            await saveToMySQL();
            closeCascadingDirModal();
            showToast('Cascading Direktur berhasil disimpan!');
            renderCascadingView(document.getElementById('mainContent'));
        }

            DB.cascadingTim.push({
                id: 'ct_' + Date.now(),

                targetDirektur: targetDir,
                timKey: activeTimKey,
                unitTargets: checkedUnits

            closeCascadingTimModal();
            showToast('Cascading ke Unit/Prodi berhasil disimpan!');
            renderCascadingView(document.getElementById('mainContent'));

        function getIndikatorList() {
            const s = new Set();
            (DB.cascadingDirektur || []).forEach(c => { if (c.target) s.add(c.target); });
            (DB.renstraIndikatorKinerja || []).forEach(ik => { if (ik.namaIndikator) s.add(ik.namaIndikator); });
            return Array.from(s);
        }

        function openCapaianModal(idx = -1) {
            if (getIndikatorList().length === 0) {
                showToast('Tambahkan Indikator di menu Renstra terlebih dahulu!', 'error');
                return;
            }
            const m = document.getElementById('capaianModal');
            m.classList.remove('hidden'); m.classList.add('flex');
            document.getElementById('editCapaianIdx').value = idx;
            if (idx !== -1 && DB.capaian[idx]) {
                const c = DB.capaian[idx];
                document.getElementById('capTahun').value = c.tahun || '2025';
                document.getElementById('capTriwulan').value = c.triwulan || 'TW 1';
                document.getElementById('capUnit').value = c.unit;
                document.getElementById('capTimKey').value = c.timKey;
                document.getElementById('capIndikator').value = c.targetDirektur;
                document.getElementById('capRealisasi').value = c.realisasi;
                document.getElementById('capBukti').value = c.buktiLink || '';
                document.getElementById('capPermasalahan').value = c.permasalahan || '';
                document.getElementById('capTindakLanjut').value = c.tindakLanjut || '';
            }
        }

        async function saveCapaian(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editCapaianIdx').value);
            const obj = {
                id: idx !== -1 ? DB.capaian[idx].id : 'cap_' + Date.now(),
                tahun: document.getElementById('capTahun').value,
                triwulan: document.getElementById('capTriwulan').value,
                unit: document.getElementById('capUnit').value,
                timKey: document.getElementById('capTimKey').value,
                targetDirektur: document.getElementById('capIndikator').value,
                realisasi: parseFloat(document.getElementById('capRealisasi').value) || 0,
                buktiLink: document.getElementById('capBukti').value.trim(),
                permasalahan: document.getElementById('capPermasalahan').value.trim(),
                tindakLanjut: document.getElementById('capTindakLanjut').value.trim(),
                status: idx !== -1 ? DB.capaian[idx].status : 'Valid',
                statusTL: idx !== -1 ? (DB.capaian[idx].statusTL || 'Proses') : 'Proses'
            };
            if (idx !== -1) DB.capaian[idx] = obj;
            else DB.capaian.push(obj);
            await saveToMySQL();
            closeCapaianModal();
            showToast('Capaian kinerja disimpan!');
            renderCapaianView(document.getElementById('mainContent'));
        }

        async function validateCapaian(idx, status) {
            if (!DB.capaian[idx]) return;
            DB.capaian[idx].status = status;
            await saveToMySQL();
            showToast('Status capaian divalidasi!');
            renderCapaianView(document.getElementById('mainContent'));
        }

        async function deleteCapaian(idx) {
            if (!confirm('Hapus data capaian ini?')) return;
            DB.capaian.splice(idx, 1);
            await saveToMySQL();
            showToast('Capaian dihapus.', 'info');
            renderCapaianView(document.getElementById('mainContent'));

        async function saveRisiko(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editRisikoIdx').value);
            const p1 = parseInt(document.getElementById('risProb1').value) || 1;
            const d1 = parseInt(document.getElementById('risDamp1').value) || 1;
            const p2 = parseInt(document.getElementById('risProb2').value) || 1;
            const d2 = parseInt(document.getElementById('risDamp2').value) || 1;
            const pre = calculateSkorRisiko(p1, d1);
            const res = calculateSkorRisiko(p2, d2);

            const obj = {
                id: idx !== -1 ? DB.risiko[idx].id : 'ris_' + Date.now(),
                unit: document.getElementById('risUnit').value,
                timKey: document.getElementById('risTimKey').value,
                targetDirektur: document.getElementById('risIndikator').value,
                pernyataan: document.getElementById('risPernyataan').value.trim(),
                dampak: document.getElementById('risDampak').value.trim(),
                prob1: p1, damp1: d1, skor1: pre.skor, warnaPre: pre.warna,
                mitigasi: document.getElementById('risMitigasi').value.trim(),
                prob2: p2, damp2: d2, skor2: res.skor, warnaResidu: res.warna
            };
            if (idx !== -1) DB.risiko[idx] = obj;

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-slate-900 text-base">Daftar Akun Pejabat & User Sistem</h3>
                            <p class="text-xs text-slate-500">Kelola akun login pengguna</p>
                        </div>
                        <button onclick="openUserModal()" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-xl text-xs shadow">Tambah User</button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-slate-50 font-semibold border-b">
                                <tr>
                                    <th class="p-3">Nama Pejabat</th>
                                    <th class="p-3">Username</th>
                                    <th class="p-3">Password</th>
                                    <th class="p-3">Role</th>
                                    <th class="p-3">Unit</th>
                                    <th class="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                ${(DB.users || []).map((u, idx) => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-3 font-bold">${u.name}</td>
                                        <td class="p-3 font-mono text-blue-700">${u.username}</td>
                                        <td class="p-3 font-mono">${u.password}</td>
                                        <td class="p-3 uppercase font-semibold">${u.role}</td>
                                        <td class="p-3">${u.unit}</td>
                                        <td class="p-3 text-center space-x-1">
                                            <button onclick="openUserModal(${idx})" class="p-1.5 bg-blue-100 text-blue-700 rounded"><i class="fa-solid fa-pen"></i></button>
                                            ${u.username !== 'admin' ? `<button onclick="deleteUser(${idx})" class="p-1.5 bg-rose-100 text-rose-600 rounded"><i class="fa-solid fa-trash"></i></button>` : ''}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="userModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-3">
                        <h3 class="font-bold text-slate-900 text-base border-b pb-3">Form User</h3>
                        <form onsubmit="saveUser(event)" class="space-y-3 text-sm">
                            <input type="hidden" id="editUserIdx" value="-1">
                            <div><label class="block font-semibold mb-1">Nama Pejabat</label><input type="text" id="usrName" required class="w-full p-2.5 bg-slate-50 border rounded-xl"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block font-semibold mb-1">Username</label><input type="text" id="usrUsername" required class="w-full p-2.5 bg-slate-50 border rounded-xl"></div>
                                <div><label class="block font-semibold mb-1">Password</label><input type="text" id="usrPassword" required value="123" class="w-full p-2.5 bg-slate-50 border rounded-xl"></div>
                            </div>
                            <div><label class="block font-semibold mb-1">Role</label><select id="usrRole" class="w-full p-2.5 bg-slate-50 border rounded-xl"><option value="ketua_unit">Ketua Unit</option><option value="tim_kerja">Ketua Tim Kerja</option><option value="direktur">Direktur</option><option value="admin">Admin</option></select></div>
                            <div><label class="block font-semibold mb-1">Unit</label><input type="text" id="usrUnit" required class="w-full p-2.5 bg-slate-50 border rounded-xl"></div>
                            <div class="flex justify-end space-x-2 pt-2">
                                <button type="button" onclick="document.getElementById('userModal').classList.add('hidden')" class="px-4 py-2 bg-slate-200 rounded-xl">Batal</button>
                                <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-xl">Simpan</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function openUserModal(idx = -1) {
            const m = document.getElementById('userModal');
            m.classList.remove('hidden'); m.classList.add('flex');
            document.getElementById('editUserIdx').value = idx;
            if (idx !== -1 && DB.users[idx]) {
                const u = DB.users[idx];
                document.getElementById('usrName').value = u.name;
                document.getElementById('usrUsername').value = u.username;
                document.getElementById('usrPassword').value = u.password;
                document.getElementById('usrRole').value = u.role;
                document.getElementById('usrUnit').value = u.unit;
            }
        }

        async function saveUser(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editUserIdx').value);
            const obj = {
                id: idx !== -1 ? DB.users[idx].id : 'u_' + Date.now(),
                name: document.getElementById('usrName').value.trim(),
                username: document.getElementById('usrUsername').value.trim(),
                password: document.getElementById('usrPassword').value.trim(),
                role: document.getElementById('usrRole').value,
                unit: document.getElementById('usrUnit').value.trim()
            };
            if (idx !== -1) DB.users[idx] = obj;
            else DB.users.push(obj);
            await saveToMySQL();
            document.getElementById('userModal').classList.add('hidden');
            showToast('User disimpan!');
            renderAdminView(document.getElementById('mainContent'));
        }

        async function deleteUser(idx) {
            if (!confirm('Hapus user ini?')) return;
            DB.users.splice(idx, 1);
            await saveToMySQL();
            renderAdminView(document.getElementById('mainContent'));
        }

        // ============================================================================
        // 13. LAPORAN PDF VIEW
        // ============================================================================
        function renderLaporanView(container) {
            document.getElementById('pageTitle').innerText = 'Ekspor & Download PDF';
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center no-print">
                        <div>
                            <h3 class="font-bold text-slate-900 text-base">Cetak Laporan Resmi Kinerja & Risiko</h3>
                            <p class="text-xs text-slate-500">Klik tombol di samping untuk mencetak atau menyimpan sebagai PDF</p>
                        </div>
                        <button onclick="window.print()" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl text-sm shadow"><i class="fa-solid fa-print mr-2"></i>Cetak / Download PDF</button>
                    </div>

                    <div id="printableArea" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6 text-xs">
                        <div class="text-center border-b-2 border-slate-800 pb-4">
                            <h2 class="text-base font-bold uppercase">KEMENTERIAN PERINDUSTRIAN REPUBLIK INDONESIA</h2>
                            <h3 class="text-sm font-bold uppercase text-blue-800">POLITEKNIK INDUSTRI PETROKIMIA BANTEN</h3>
                            <p class="text-slate-600 mt-1">Laporan Capaian Kinerja & Manajemen Risiko (Ki-Jaro)</p>
                        </div>

                        <div>
                            <h4 class="font-bold mb-2">I. Rekapitulasi Capaian Kinerja</h4>
                            <table class="w-full border-collapse border border-slate-300">
                                <thead class="bg-slate-100">
                                    <tr>
                                        <th class="border border-slate-300 p-2">Periode</th>
                                        <th class="border border-slate-300 p-2">Unit</th>
                                        <th class="border border-slate-300 p-2">Indikator</th>
                                        <th class="border border-slate-300 p-2 text-center">Realisasi</th>
                                        <th class="border border-slate-300 p-2">Kendala & RTL</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${(DB.capaian || []).length === 0 ? `<tr><td colspan="5" class="p-4 text-center">Belum ada data.</td></tr>` : DB.capaian.map(c => `
                                        <tr>
                                            <td class="border border-slate-300 p-2">${c.tahun} -${c.triwulan}</td>
                                            <td class="border border-slate-300 p-2">${c.unit}</td>
                                            <td class="border border-slate-300 p-2">${c.targetDirektur}</td>
                                            <td class="border border-slate-300 p-2 text-center font-bold">${c.realisasi}</td>
                                            <td class="border border-slate-300 p-2">${c.permasalahan \vert{}\vert{} '-'} /${c.tindakLanjut || '-'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================================
        // 14. SAFE STARTUP (TIDAK PERNAH BLANK PUTIH)
        // ============================================================================
        function initApp() {
            try {
                // 1. Muat cache lokal secara instan
                loadFromLocalCache();

                // 2. Cek user yang sedang login
                const savedUserRaw = localStorage.getItem('ki_jaro_user');
                if (savedUserRaw) {
                    const parsed = JSON.parse(savedUserRaw);
                    if (parsed && parsed.username) {
                        currentUser = (DB.users || []).find(u => u.username === parsed.username) || parsed;
                    }
                }

                // 3. Langsung tampilkan halaman (Login atau Dashboard) tanpa menunggu jaringan!
                if (currentUser && currentUser.name) {
                    renderDashboardLayout();
                } else {
                    renderLogin();
                }

                // 4. Sinkronkan dengan MySQL di background, lalu perbarui tampilan jika ada data baru
                loadDataFromMySQL().then((updated) => {
                    if (updated && currentUser && currentUser.name) {
                        switchTab(activeTab);
                    }
                });
            } catch (err) {
                console.error("Critical Init Error:", err);
                localStorage.removeItem('ki_jaro_user');
                renderLogin();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
