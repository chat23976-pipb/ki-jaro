        // ============================================================================
        const LOCAL_STORAGE_KEY = 'ki_jaro_db_v2';

        function ensureDBIntegrity(data) {
            if (!data || typeof data !== 'object') return;
            const keys = [
                'users', 'timKerjaList', 'unitList',
                'renstraTujuanKemenperin', 'renstraBPSDMI', 'renstraSasaranKinerja', 'renstraIndikatorKinerja',
                'cascadingDirektur', 'cascadingTim', 'capaian', 'risiko', 'realisasiAnggaranAdmin', 'dokumenPerencanaan'
            ];
            keys.forEach(k => {
                if (Array.isArray(data[k])) {
                    if (k === 'users' && data[k].length === 0) {
                        DB[k] = [...DEFAULT_DB.users];
                    } else {
                        DB[k] = data[k];
                    }
                } else if (!Array.isArray(DB[k])) {
                    DB[k] = [...DEFAULT_DB[k]];
                }
            });
            if (data.spreadsheetUrl) DB.spreadsheetUrl = data.spreadsheetUrl;
            if (data.customCloudApiUrl !== undefined) DB.customCloudApiUrl = data.customCloudApiUrl;
            if (data.lastUpdated) DB.lastUpdated = data.lastUpdated;
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(DB));
            } catch (e) {
                console.error("LocalStorage Save Error:", e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    ensureDBIntegrity(parsed);
                    return parsed;
                }
            } catch (e) {
                console.error("LocalStorage Load Error:", e);
            }
            return null;
        }

        async function loadDataFromMySQL() {
            // 1. Muat dari LocalStorage terlebih dahulu sebagai fallback cepat
            const localData = loadFromLocalStorage();
            const localTimestamp = localData && localData.lastUpdated ? Number(localData.lastUpdated) : 0;

            // 2. Coba ambil data terbaru dari Backend Server (/api/load-state/main_kijaro) dengan Anti-Cache
            try {
                const endpoint = DB.customCloudApiUrl
                    ? `${DB.customCloudApiUrl}?action=load&key=main_kijaro&t=${Date.now()}`
                    : `/api/load-state/main_kijaro?t=${Date.now()}`;

                const response = await fetch(endpoint, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    let serverDB = null;

                    if (result && result.data) {
                        serverDB = typeof result.data === 'string' ? JSON.parse(result.data) : result.data;
                    } else if (result && result.value) {
                        serverDB = typeof result.value === 'string' ? JSON.parse(result.value) : result.value;
                    } else if (result && Array.isArray(result.users)) {
                        serverDB = result;
                    }

                    if (serverDB && typeof serverDB === 'object') {
                        const serverTimestamp = Number(serverDB.lastUpdated || 0);
                        // Cek apakah server memiliki data atau lebih baru
                        const serverHasRecords =
                            (serverDB.renstraTujuanKemenperin && serverDB.renstraTujuanKemenperin.length > 0) ||
                            (serverDB.cascadingDirektur && serverDB.cascadingDirektur.length > 0) ||
                            (serverDB.capaian && serverDB.capaian.length > 0) ||
                            (serverDB.risiko && serverDB.risiko.length > 0) ||
                            serverTimestamp > 0;

                        if (serverHasRecords && serverTimestamp >= localTimestamp) {
                            ensureDBIntegrity(serverDB);
                            saveToLocalStorage();
                        } else if (localTimestamp > serverTimestamp) {
                            // Jika lokal lebih baru daripada server, dorong data lokal ke server
                            ensureDBIntegrity(localData);
                            await pushToServerOnly();
                        }
                        serverSyncOnline = true;
                        updateSyncBadgeUI();
                        return;
                    }
                }
            } catch (e) {
                console.warn("Server API belum merespons, menggunakan mode penyimpanan lokal:", e.message);
            }

            serverSyncOnline = false;
            updateSyncBadgeUI();
        }

        async function pushToServerOnly() {
            const payload = {
                key: 'main_kijaro',
                value: DB,
                data: DB
            };

            const endpoint = DB.customCloudApiUrl ? DB.customCloudApiUrl : '/api/save-state';
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'Cache-Control': 'no-cache'
                },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            serverSyncOnline = true;
            updateSyncBadgeUI();
        }

        async function saveToMySQL() {
            DB.lastUpdated = Date.now();
            // 1. Selalu simpan instan ke LocalStorage (agar di-reload tidak pernah hilang)
            saveToLocalStorage();

            // 2. Simpan ke Server MySQL / Dokploy API
            try {
                await pushToServerOnly();
            } catch (e) {
                serverSyncOnline = false;
                updateSyncBadgeUI();
                console.warn("Data tersimpan aman di Browser Lokal. Sinkronisasi ke Server API tertunda:", e.message);
            }
        }

        function updateSyncBadgeUI() {
            const badge = document.getElementById('syncStatusBadge');
            if (!badge) return;
            if (serverSyncOnline) {
                badge.className = "px-3 py-1 bg-emerald-50 text-emerald-700 text-xs font-semibold rounded-full border border-emerald-200 flex items-center space-x-1.5";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>Database Server Terhubung</span>`;
            } else {
                badge.className = "px-3 py-1 bg-amber-50 text-amber-700 text-xs font-semibold rounded-full border border-amber-200 flex items-center space-x-1.5 cursor-pointer";
                badge.title = "Data tersimpan aman di browser ini. Klik di menu Admin untuk melihat pengaturan sinkronisasi server.";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>Tersimpan Lokal (Browser)</span>`;
            }
        }

        function calculateSkorRisiko(p, d) {
            const val = (parseInt(p) || 1) * (parseInt(d) || 1);
            let kuadran = '';
            let warna = '';
            let level = '';

            if (val >= 20) { level = 'Sangat Tinggi (5)'; kuadran = 'Kuadran IV (Sangat Tinggi)'; warna = 'bg-rose-600 text-white'; }
            else if (val >= 15) { level = 'Tinggi (4)'; kuadran = 'Kuadran III (Tinggi)'; warna = 'bg-amber-500 text-white'; }
            else if (val >= 12) { level = 'Sedang (3)'; kuadran = 'Kuadran II (Sedang)'; warna = 'bg-yellow-400 text-slate-900'; }
            else if (val >= 7) { level = 'Rendah (2)'; kuadran = 'Kuadran I (Rendah)'; warna = 'bg-emerald-500 text-white'; }
            else { level = 'Sangat Rendah (1)'; kuadran = 'Kuadran I (Sangat Rendah)'; warna = 'bg-blue-500 text-white'; }

            return { skor: val, level, kuadran, warna };
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-white shadow-lg flex items-center space-x-3 transition-all transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info'} text-lg"></i><span class="text-sm font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

            } else {
                showToast('Username atau password salah!', 'error');

        function openRealisasiAnggaranModal(mode, idx = -1) {
            if (DB.renstraIndikatorKinerja.length === 0) {
                showToast('Belum ada Indikator Kinerja Renstra terinput!', 'error');
                return;
            }
            const modal = document.getElementById('realisasiAnggaranModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            document.getElementById('editRaIndex').value = idx;
            if (mode === 'edit' && idx !== -1) {
                document.getElementById('raModalTitle').innerText = 'Edit Realisasi Anggaran Riil';
                const item = DB.realisasiAnggaranAdmin[idx];
                document.getElementById('raTahun').value = item.tahun;
                document.getElementById('raTriwulan').value = item.triwulan;
                document.getElementById('raIndikatorId').value = item.indikatorId;
                document.getElementById('raNilai').value = item.realisasiAnggaran;
            } else {
                document.getElementById('raModalTitle').innerText = 'Input Realisasi Anggaran Riil';
                document.getElementById('editRaIndex').value = -1;
                document.getElementById('raNilai').value = '45000000';
            }

        function closeRealisasiAnggaranModal() {
            const modal = document.getElementById('realisasiAnggaranModal');
            if (modal) { modal.classList.remove('flex'); modal.classList.add('hidden'); }
        }

        async function saveRealisasiAnggaran(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editRaIndex').value);
            const tahun = document.getElementById('raTahun').value;
            const triwulan = document.getElementById('raTriwulan').value;
            const indikatorId = document.getElementById('raIndikatorId').value;
            const realisasiAnggaran = parseFloat(document.getElementById('raNilai').value) || 0;

            const raObj = {
                id: idx !== -1 ? DB.realisasiAnggaranAdmin[idx].id : 'ra_' + Date.now(),
                tahun,
                triwulan,
                indikatorId,
                realisasiAnggaran
            };

            if (idx !== -1) {
                DB.realisasiAnggaranAdmin[idx] = raObj;
                showToast('Realisasi anggaran berhasil diperbarui!');
            } else {
                DB.realisasiAnggaranAdmin.push(raObj);
                showToast('Realisasi anggaran riil berhasil disimpan!');
            }

            await saveToMySQL();
            closeRealisasiAnggaranModal();
            renderRenstraView(document.getElementById('mainContent'));
        }

        async function deleteRealisasiAnggaran(idx) {
            if (!confirm('Hapus data realisasi anggaran ini?')) return;
            DB.realisasiAnggaranAdmin.splice(idx, 1);
            await saveToMySQL();
            showToast('Realisasi anggaran dihapus.', 'info');
            renderRenstraView(document.getElementById('mainContent'));
        }

        async function saveRenstra(e) {
            e.preventDefault();
            const isEdit = editingRenstraIndex !== -1;

            if (currentRenstraType === 'tujuanKemenperin') {
                const data = { id: isEdit ? DB.renstraTujuanKemenperin[editingRenstraIndex].id : 'tk_' + Date.now(), kode: document.getElementById('r_kode').value, sasaran: document.getElementById('r_sasaran').value };
                if (isEdit) DB.renstraTujuanKemenperin[editingRenstraIndex] = data;
                else DB.renstraTujuanKemenperin.push(data);
            } else if (currentRenstraType === 'bpsdmi') {
                const data = { id: isEdit ? DB.renstraBPSDMI[editingRenstraIndex].id : 'bp_' + Date.now(), tujuanKemenperinId: document.getElementById('r_parent').value, kode: document.getElementById('r_kode').value, sasaran: document.getElementById('r_sasaran').value };
                if (isEdit) DB.renstraBPSDMI[editingRenstraIndex] = data;
                else DB.renstraBPSDMI.push(data);
            } else if (currentRenstraType === 'sasaranKinerja') {
                const data = { id: isEdit ? DB.renstraSasaranKinerja[editingRenstraIndex].id : 'sk_' + Date.now(), bpsdmiId: document.getElementById('r_parent').value, kode: document.getElementById('r_kode').value, sasaranKinerja: document.getElementById('r_sasaranKinerja').value };
                if (isEdit) DB.renstraSasaranKinerja[editingRenstraIndex] = data;
                else DB.renstraSasaranKinerja.push(data);
            } else if (currentRenstraType === 'indikatorKinerja') {
                const data = {
                    id: isEdit ? DB.renstraIndikatorKinerja[editingRenstraIndex].id : 'ik_' + Date.now(),
                    sasaranKinerjaId: document.getElementById('r_parent').value,
                    kodeIndikator: document.getElementById('r_kodeIndikator').value,
                    namaIndikator: document.getElementById('r_namaIndikator').value,
                    satuan: document.getElementById('r_satuan').value,
                    target2025: parseFloat(document.getElementById('r_2025').value) || 0,
                    target2026: parseFloat(document.getElementById('r_2026').value) || 0,
                    target2027: parseFloat(document.getElementById('r_2027').value) || 0,
                    target2028: parseFloat(document.getElementById('r_2028').value) || 0,
                    target2029: parseFloat(document.getElementById('r_2029').value) || 0,
                    anggaran2025: parseFloat(document.getElementById('r_ang2025').value) || 0,
                    anggaran2026: parseFloat(document.getElementById('r_ang2026').value) || 0,
                    anggaran2027: parseFloat(document.getElementById('r_ang2027').value) || 0,
                    anggaran2028: parseFloat(document.getElementById('r_ang2028').value) || 0,
                    anggaran2029: parseFloat(document.getElementById('r_ang2029').value) || 0
                };
                if (isEdit) DB.renstraIndikatorKinerja[editingRenstraIndex] = data;
                else DB.renstraIndikatorKinerja.push(data);
            }
            await saveToMySQL();
            closeRenstraModal();
            showToast('Data Renstra berhasil disimpan!');
            renderRenstraView(document.getElementById('mainContent'));
        }

        async function deleteRenstra(type, idx) {
            let canDelete = true;
            if (type === 'tujuanKemenperin') {
                const item = DB.renstraTujuanKemenperin[idx];
                if (DB.renstraBPSDMI.some(b => b.tujuanKemenperinId === item.id)) canDelete = false;
            } else if (type === 'bpsdmi') {
                const item = DB.renstraBPSDMI[idx];
                if (DB.renstraSasaranKinerja.some(s => s.bpsdmiId === item.id)) canDelete = false;
            } else if (type === 'sasaranKinerja') {
                const item = DB.renstraSasaranKinerja[idx];
                if (DB.renstraIndikatorKinerja.some(i => i.sasaranKinerjaId === item.id)) canDelete = false;
            } else if (type === 'indikatorKinerja') {
                const item = DB.renstraIndikatorKinerja[idx];
                if (DB.cascadingDirektur.some(c => c.indikatorId === item.id)) canDelete = false;
            }

            if (!canDelete) {
                showToast('Data ini tidak dapat dihapus karena sudah digunakan pada level di bawahnya!', 'error');
                return;
            }

            if (confirm('Apakah Anda yakin ingin menghapus data Renstra ini?')) {
                if (type === 'tujuanKemenperin') DB.renstraTujuanKemenperin.splice(idx, 1);
                else if (type === 'bpsdmi') DB.renstraBPSDMI.splice(idx, 1);
                else if (type === 'sasaranKinerja') DB.renstraSasaranKinerja.splice(idx, 1);
                else if (type === 'indikatorKinerja') DB.renstraIndikatorKinerja.splice(idx, 1);
                
                await saveToMySQL();
                showToast('Data berhasil dihapus.', 'info');
                renderRenstraView(document.getElementById('mainContent'));
            }
        }

        function getSortedDokumen() {
            const sortByEl = document.getElementById('sortDokumenBy');
            const sortBy = sortByEl ? sortByEl.value : 'nama';
            let docs = DB.dokumenPerencanaan.map((d, idx) => ({ ...d, _origIdx: idx }));
            if (sortBy === 'nama') docs.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
            else if (sortBy === 'tahun') docs.sort((a, b) => (a.tahun || '').localeCompare(b.tahun || ''));
            else if (sortBy === 'kategori') docs.sort((a, b) => (a.kategori || '').localeCompare(b.kategori || ''));
            return docs;
        }

        function openDokumenModal() { document.getElementById('dokumenModal').classList.remove('hidden'); document.getElementById('dokumenModal').classList.add('flex'); }
        function closeDokumenModal() { document.getElementById('dokumenModal').classList.remove('flex'); document.getElementById('dokumenModal').classList.add('hidden'); }
        
        async function saveDokumen(e) {
            e.preventDefault();
            DB.dokumenPerencanaan.push({
                nama: document.getElementById('docNama').value,
                kategori: document.getElementById('docKategori').value,
                tahun: document.getElementById('docTahun').value,
                link: document.getElementById('docLink').value
            });
            await saveToMySQL();
            closeDokumenModal();
            showToast('Dokumen perencanaan berhasil ditambahkan!');
            renderDokumenView(document.getElementById('mainContent'));
        }

        async function deleteDokumen(origIdx) {
            if (!confirm('Hapus dokumen perencanaan ini?')) return;
            DB.dokumenPerencanaan.splice(origIdx, 1);
            await saveToMySQL();
            showToast('Dokumen dihapus.', 'info');
            renderDokumenView(document.getElementById('mainContent'));
        }

        function updateDirRenstraOptions(tahun) {
            const sel = document.getElementById('dirIndikatorRenstra');
            if (!sel) return;
            const matching = DB.renstraIndikatorKinerja;
            sel.innerHTML = matching.length === 0 ? '<option value="">Belum ada Indikator Renstra</option>' : matching.map(ik => {
                const target = ik['target' + tahun] !== undefined ? ik['target' + tahun] : 100;
                const anggaran = ik['anggaran' + tahun] !== undefined ? ik['anggaran' + tahun] : 0;
                return `<option value="${ik.id}" data-nama="${ik.namaIndikator}" data-satuan="${ik.satuan}" data-target="${target}" data-anggaran="${anggaran}">${ik.kodeIndikator} - ${ik.namaIndikator} (${ik.satuan})</option>`;
            }).join('');
            updateDirAnggaranPreview();
        }

        function updateDirAnggaranPreview() {
            const sel = document.getElementById('dirIndikatorRenstra');
            if (!sel || sel.options.length === 0 || !sel.options[sel.selectedIndex]) return;
            const opt = sel.options[sel.selectedIndex];
            const target = opt.getAttribute('data-target') || '100';
            const anggaran = parseFloat(opt.getAttribute('data-anggaran') || '0');
            document.getElementById('previewTargetVal').innerText = target;
            document.getElementById('previewAnggaranVal').innerText = `Rp ${Number(anggaran).toLocaleString('id-ID')}`;
        }

        function updateTimDirRefOptions(tahun) {
            const sel = document.getElementById('timDirRef');
            if (!sel) return;
            const timEl = document.getElementById('timPelaksanaSelect');
            const activeTimKey = timEl ? timEl.value : currentUser.timKey;
            const matching = DB.cascadingDirektur.filter(c => (c.timKeys || []).includes(activeTimKey) && (c.tahun || '2025') === tahun);
            sel.innerHTML = matching.length === 0 ? '<option value="">Tidak ada indikator dicascading pada tahun ini</option>' : matching.map(c => `<option value="${c.target}">${c.target} (Target: ${c.targetVal !== undefined ? c.targetVal : 100} ${c.satuan || '%'})</option>`).join('');
        }

        function openCascadingDirModal() {
            if (DB.renstraIndikatorKinerja.length === 0) {
                showToast('Belum ada data Indikator Kinerja di Renstra. Isi Renstra Tier 4 terlebih dahulu.', 'error');
                return;
            }
            document.getElementById('cascadingDirModal').classList.remove('hidden'); document.getElementById('cascadingDirModal').classList.add('flex');
            const yrDir = document.getElementById('dirTahunTarget');
            if (yrDir) updateDirRenstraOptions(yrDir.value);
        }
        function closeCascadingDirModal() { document.getElementById('cascadingDirModal').classList.remove('flex'); document.getElementById('cascadingDirModal').classList.add('hidden'); }
        
        async function saveCascadingDir(e) {
            e.preventDefault();
            const tahun = document.getElementById('dirTahunTarget').value;
            const sel = document.getElementById('dirIndikatorRenstra');
            const opt = sel.options[sel.selectedIndex];
            const indikatorName = opt.getAttribute('data-nama');
            const satuan = opt.getAttribute('data-satuan');
            const targetVal = parseFloat(opt.getAttribute('data-target')) || 100;
            const anggaran = parseFloat(opt.getAttribute('data-anggaran')) || 0;
            const checked = Array.from(document.querySelectorAll('input[name="timCheck"]:checked')).map(el => el.value);
            
            if (checked.length === 0) {
                showToast('Pilih minimal 1 Ketua Tim Kerja!', 'error');
                return;
            }

            DB.cascadingDirektur.push({
                id: 'cd_' + Date.now(),
                indikatorId: sel.value,
                tahun: tahun,
                target: indikatorName,
                targetVal: targetVal,
                satuan: satuan,
                anggaran: anggaran,
                timKeys: checked,
                status: 'Aktif'
            });
            await saveToMySQL();
            closeCascadingDirModal();
            showToast('Cascading Direktur berhasil disimpan!');
            renderCascadingView(document.getElementById('mainContent'));
        }

        async function confirmDeleteCascadingDir(idx) {
            const item = DB.cascadingDirektur[idx];
            if (confirm(`Apakah Anda yakin ingin menghapus cascading indikator "${item.target}"?`)) {
                DB.cascadingTim = DB.cascadingTim.filter(ct => !(ct.targetDirektur === item.target && ct.tahun === item.tahun));
                DB.cascadingDirektur.splice(idx, 1);
                await saveToMySQL();
                showToast('Cascading Direktur berhasil dihapus.', 'info');
                renderCascadingView(document.getElementById('mainContent'));
            }
        }

        function openCascadingTimModal() {
            document.getElementById('cascadingTimModal').classList.remove('hidden');
            document.getElementById('cascadingTimModal').classList.add('flex');
            const yrEl = document.getElementById('timTahunTarget');
            if (yrEl) updateTimDirRefOptions(yrEl.value);
        }
        function closeCascadingTimModal() { document.getElementById('cascadingTimModal').classList.remove('flex'); document.getElementById('cascadingTimModal').classList.add('hidden'); }

        async function saveCascadingTim(e) {
            e.preventDefault();
            const tahun = document.getElementById('timTahunTarget').value;
            const targetDir = document.getElementById('timDirRef').value;
            const timEl = document.getElementById('timPelaksanaSelect');
            const activeTimKey = timEl ? timEl.value : currentUser.timKey;

            if (!targetDir) {
                showToast('Pilih indikator rujukan yang valid!', 'error');
                return;
            }
            const checkedUnits = Array.from(document.querySelectorAll('input[name="unitCheck"]:checked')).map(el => el.value);
            if (checkedUnits.length === 0) {
                showToast('Pilih minimal 1 Unit / Prodi tujuan!', 'error');
                return;
            }
            DB.cascadingTim.push({
                id: 'ct_' + Date.now(),
                tahun: tahun,
                targetDirektur: targetDir,
                timKey: activeTimKey,
                unitTargets: checkedUnits
            });
            await saveToMySQL();
            closeCascadingTimModal();
            showToast('Cascading ke Unit/Prodi berhasil disimpan!');
            renderCascadingView(document.getElementById('mainContent'));
        }

        async function confirmDeleteCascadingTim(origIdx) {
            const item = DB.cascadingTim[origIdx];
            if (!item) return;
            if (confirm(`Apakah Anda yakin ingin menghapus cascading ke unit/prodi untuk indikator "${item.targetDirektur}"?`)) {
                DB.cascadingTim.splice(origIdx, 1);
                await saveToMySQL();
                showToast('Cascading Tim dihapus.', 'info');
                renderCascadingView(document.getElementById('mainContent'));
            }
        }

        function getAvailableIndikatorOptions() {
            const set = new Set();
            DB.cascadingDirektur.forEach(c => { if (c.target) set.add(c.target); });
            DB.renstraIndikatorKinerja.forEach(ik => { if (ik.namaIndikator) set.add(ik.namaIndikator); });
            return Array.from(set);
        }

        function openCapaianModal(origIdx = -1) {
            const inds = getAvailableIndikatorOptions();
            if (inds.length === 0) {
                showToast('Belum ada Indikator Kinerja di Renstra atau Cascading!', 'error');
                return;
            }
            const modal = document.getElementById('capaianModal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            document.getElementById('editCapaianIdx').value = origIdx;

            if (origIdx !== -1 && DB.capaian[origIdx]) {
                const c = DB.capaian[origIdx];
                document.getElementById('capaianModalTitle').innerText = 'Edit Realisasi Capaian Kinerja';
                document.getElementById('capTahun').value = c.tahun || '2025';
                document.getElementById('capTriwulan').value = c.triwulan || 'TW 1';
                document.getElementById('capUnit').value = c.unit || currentUser.unit;
                document.getElementById('capTimKey').value = c.timKey || 'Akademik';
                document.getElementById('capIndikator').value = c.targetDirektur;
                document.getElementById('capRealisasi').value = c.realisasi;
                document.getElementById('capBukti').value = c.buktiLink || '';
                document.getElementById('capPermasalahan').value = c.permasalahan || '';
                document.getElementById('capTindakLanjut').value = c.tindakLanjut || '';
            } else {
                document.getElementById('capaianModalTitle').innerText = 'Input Realisasi Capaian Kinerja';
            }
        }

        function closeCapaianModal() {
            const modal = document.getElementById('capaianModal');
            if (modal) { modal.classList.remove('flex'); modal.classList.add('hidden'); }
        }

        async function saveCapaian(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editCapaianIdx').value);
            const obj = {
                id: idx !== -1 ? DB.capaian[idx].id : 'cap_' + Date.now(),
                tahun: document.getElementById('capTahun').value,
                triwulan: document.getElementById('capTriwulan').value,
                unit: document.getElementById('capUnit').value,
                timKey: document.getElementById('capTimKey').value,
                targetDirektur: document.getElementById('capIndikator').value,
                realisasi: parseFloat(document.getElementById('capRealisasi').value) || 0,
                buktiLink: document.getElementById('capBukti').value.trim(),
                permasalahan: document.getElementById('capPermasalahan').value.trim(),
                tindakLanjut: document.getElementById('capTindakLanjut').value.trim(),
                status: idx !== -1 ? DB.capaian[idx].status : (currentUser.role === 'admin' || currentUser.role === 'direktur' ? 'Valid' : 'Menunggu Validasi'),
                statusTL: idx !== -1 ? (DB.capaian[idx].statusTL || 'Proses') : 'Proses',
                catatanPimpinan: idx !== -1 ? (DB.capaian[idx].catatanPimpinan || '') : ''
            };

            if (idx !== -1) {
                DB.capaian[idx] = obj;
                showToast('Data capaian berhasil diperbarui!');
            } else {
                DB.capaian.push(obj);
                showToast('Data capaian berhasil ditambahkan!');
            }

            await saveToMySQL();
            closeCapaianModal();
            renderCapaianView(document.getElementById('mainContent'));
        }

        async function validateCapaian(origIdx, newStatus) {
            if (!DB.capaian[origIdx]) return;
            DB.capaian[origIdx].status = newStatus;
            await saveToMySQL();
            showToast(`Status capaian diubah menjadi: ${newStatus}`);
            renderCapaianView(document.getElementById('mainContent'));
        }

        async function deleteCapaian(origIdx) {
            if (!confirm('Apakah Anda yakin ingin menghapus data capaian ini?')) return;
            DB.capaian.splice(origIdx, 1);
            await saveToMySQL();
            showToast('Data capaian dihapus.', 'info');
            renderCapaianView(document.getElementById('mainContent'));
        }

        async function saveRisiko(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editRisikoIdx').value);
            const prob1 = parseInt(document.getElementById('risProb1').value) || 1;
            const damp1 = parseInt(document.getElementById('risDamp1').value) || 1;
            const prob2 = parseInt(document.getElementById('risProb2').value) || 1;
            const damp2 = parseInt(document.getElementById('risDamp2').value) || 1;

            const preCalc = calculateSkorRisiko(prob1, damp1);
            const resCalc = calculateSkorRisiko(prob2, damp2);

            const obj = {
                id: idx !== -1 ? DB.risiko[idx].id : 'ris_' + Date.now(),
                tahun: document.getElementById('risTahun').value,
                unit: document.getElementById('risUnit').value,
                timKey: document.getElementById('risTimKey').value,
                targetDirektur: document.getElementById('risIndikator').value,
                pernyataan: document.getElementById('risPernyataan').value.trim(),
                dampak: document.getElementById('risDampak').value.trim(),
                prob1, damp1,
                skor1: preCalc.skor,
                kuadranPre: preCalc.kuadran,
                warnaPre: preCalc.warna,
                mitigasi: document.getElementById('risMitigasi').value.trim(),
                prob2, damp2,
                skor2: resCalc.skor,
                kuadranResidu: resCalc.kuadran,
                warnaResidu: resCalc.warna,
                statusMitigasi: idx !== -1 ? (DB.risiko[idx].statusMitigasi || ' Terlaksana') : 'Terlaksana'
            };

            if (idx !== -1) {
                DB.risiko[idx] = obj;
                showToast('Data risiko berhasil diperbarui!');
            } else {
                DB.risiko.push(obj);
                showToast('Data risiko berhasil disimpan!');
            }

            await saveToMySQL();
            closeRisikoModal();
            renderRisikoView(document.getElementById('mainContent'));
        }

            dlAnchor.setAttribute("href", dataStr);

        async function importDatabaseJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    ensureDBIntegrity(imported);
                    await saveToMySQL();
                    showToast('Database berhasil dipulihkan (Restore)! Reloading...');
                    renderAdminView(document.getElementById('mainContent'));
                } catch (err) {
                    showToast('Format file JSON tidak valid!', 'error');
                }
            };
            reader.readAsText(file);

                        <!-- Ringkasan Capaian -->
                        <div class="space-y-2">
                            <h4 class="font-bold text-sm text-slate-900">I. Rekapitulasi Capaian Kinerja</h4>
                            <table class="w-full text-left border-collapse border border-slate-300">
                                <thead class="bg-slate-100">
                                    <tr>
                                        <th class="border border-slate-300 p-2">No</th>
                                        <th class="border border-slate-300 p-2">Tahun / TW</th>
                                        <th class="border border-slate-300 p-2">Unit Kerja</th>
                                        <th class="border border-slate-300 p-2">Indikator Kinerja</th>
                                        <th class="border border-slate-300 p-2 text-center">Realisasi</th>
                                        <th class="border border-slate-300 p-2">Permasalahan & Tindak Lanjut</th>
                                        <th class="border border-slate-300 p-2 text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${DB.capaian.length === 0 ? `<tr><td colspan="7" class="p-4 text-center text-slate-400">Belum ada data capaian.</td></tr>` : DB.capaian.map((c, i) => `
                                        <tr>
                                            <td class="border border-slate-300 p-2 text-center">${i + 1}</td>
                                            <td class="border border-slate-300 p-2">${c.tahun} (${c.triwulan})</td>
                                            <td class="border border-slate-300 p-2 font-semibold">${c.unit}</td>
                                            <td class="border border-slate-300 p-2">${c.targetDirektur}</td>
                                            <td class="border border-slate-300 p-2 text-center font-bold">${c.realisasi}</td>
                                            <td class="border border-slate-300 p-2">Kendala: ${c.permasalahan \vert{}\vert{} '-'}<br>RTL:${c.tindakLanjut || '-'}</td>
                                            <td class="border border-slate-300 p-2 text-center">${c.status}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <!-- Ringkasan Risiko -->
                        <div class="space-y-2">
                            <h4 class="font-bold text-sm text-slate-900">II. Register Risiko & Pengendalian</h4>
                            <table class="w-full text-left border-collapse border border-slate-300">
                                <thead class="bg-slate-100">
                                    <tr>
                                        <th class="border border-slate-300 p-2">No</th>
                                        <th class="border border-slate-300 p-2">Unit Kerja</th>
                                        <th class="border border-slate-300 p-2">Pernyataan Risiko & Dampak</th>
                                        <th class="border border-slate-300 p-2 text-center">Skor Awal</th>
                                        <th class="border border-slate-300 p-2">Mitigasi</th>
                                        <th class="border border-slate-300 p-2 text-center">Skor Residu</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${DB.risiko.length === 0 ? `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada data risiko.</td></tr>` : DB.risiko.map((r, i) => `
                                        <tr>
                                            <td class="border border-slate-300 p-2 text-center">${i + 1}</td>
                                            <td class="border border-slate-300 p-2 font-semibold">${r.unit}</td>
                                            <td class="border border-slate-300 p-2"><strong>${r.pernyataan}</strong><br>Dampak:${r.dampak}</td>
                                            <td class="border border-slate-300 p-2 text-center font-bold">${r.skor1}</td>
                                            <td class="border border-slate-300 p-2">${r.mitigasi}</td>
                                            <td class="border border-slate-300 p-2 text-center font-bold">${r.skor2}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <div class="pt-10 flex justify-end">
                            <div class="text-center w-64 space-y-16">
                                <div>
                                    <p>Banten, ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
                                    <p class="font-bold">Direktur Politeknik Industri Petrokimia Banten</p>
                                </div>
                                <p class="font-bold underline">${direkturUser.name}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================================
        // 14. INITIALIZATION ON PAGE LOAD
        // ============================================================================
        window.onload = async function() {
            await loadDataFromMySQL();
            const savedUser = localStorage.getItem('ki_jaro_user');
            if (savedUser) {
                try {
                    const parsedUser = JSON.parse(savedUser);
                    const freshUser = DB.users.find(u => u.username === parsedUser.username) || parsedUser;
                    currentUser = freshUser;
                    renderDashboardLayout();
                } catch (e) {
                    renderLogin();
                }
            } else {
                renderLogin();
            }
        };
    </script>
</body>
</html>
