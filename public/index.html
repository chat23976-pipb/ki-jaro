        function calculateSkorRisiko(p, d) {
            const val = parseInt(p) * parseInt(d);
            let kuadran = '';
            let warna = '';
            let level = '';

            if (val >= 20) { level = 'Sangat Tinggi (5)'; kuadran = 'Kuadran IV (Sangat Tinggi)'; warna = 'bg-rose-600 text-white'; }
            else if (val >= 15) { level = 'Tinggi (4)'; kuadran = 'Kuadran III (Tinggi)'; warna = 'bg-amber-500 text-white'; }
            else if (val >= 12) { level = 'Sedang (3)'; kuadran = 'Kuadran II (Sedang)'; warna = 'bg-yellow-400 text-slate-900'; }
            else if (val >= 7) { level = 'Rendah (2)'; kuadran = 'Kuadran I (Rendah)'; warna = 'bg-emerald-500 text-white'; }
            else { level = 'Sangat Rendah (1)'; kuadran = 'Kuadran I (Sangat Rendah)'; warna = 'bg-blue-500 text-white'; }

            return { skor: val, level, kuadran, warna };
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-white shadow-lg flex items-center space-x-3 transition-all transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        async function deleteRenstra(type, idx) {
            let canDelete = true;
            if (type === 'tujuanKemenperin') {
                const item = DB.renstraTujuanKemenperin[idx];
                if (DB.renstraBPSDMI.some(b => b.tujuanKemenperinId === item.id)) canDelete = false;
            } else if (type === 'bpsdmi') {
                const item = DB.renstraBPSDMI[idx];
                if (DB.renstraSasaranKinerja.some(s => s.bpsdmiId === item.id)) canDelete = false;
            } else if (type === 'sasaranKinerja') {
                const item = DB.renstraSasaranKinerja[idx];
                if (DB.renstraIndikatorKinerja.some(i => i.sasaranKinerjaId === item.id)) canDelete = false;
            } else if (type === 'indikatorKinerja') {
                const item = DB.renstraIndikatorKinerja[idx];
                if (DB.cascadingDirektur.some(c => c.indikatorId === item.id)) canDelete = false;
            }

            if (!canDelete) {
                showToast('Data ini tidak dapat dihapus karena sudah digunakan dalam cascading ke level berikutnya!', 'error');
                return;
            }

            if (confirm('Apakah Anda yakin ingin menghapus data Renstra ini?')) {
                if (type === 'tujuanKemenperin') DB.renstraTujuanKemenperin.splice(idx, 1);
                else if (type === 'bpsdmi') DB.renstraBPSDMI.splice(idx, 1);
                else if (type === 'sasaranKinerja') DB.renstraSasaranKinerja.splice(idx, 1);
                else if (type === 'indikatorKinerja') DB.renstraIndikatorKinerja.splice(idx, 1);
                
                await saveToMySQL();
                showToast('Data berhasil dihapus.', 'info');
                renderRenstraView(document.getElementById('mainContent'));
            }
        }

        function updateDirRenstraOptions(tahun) {
            const sel = document.getElementById('dirIndikatorRenstra');
            if (!sel) return;
            const matching = DB.renstraIndikatorKinerja;
            sel.innerHTML = matching.length === 0 ? '<option value="">Belum ada Indikator Renstra</option>' : matching.map(ik => {
                const target = ik['target' + tahun] !== undefined ? ik['target' + tahun] : 100;
                const anggaran = ik['anggaran' + tahun] !== undefined ? ik['anggaran' + tahun] : 0;
                return `<option value="${ik.id}" data-nama="${ik.namaIndikator}" data-satuan="${ik.satuan}" data-target="${target}" data-anggaran="${anggaran}">${ik.kodeIndikator} - ${ik.namaIndikator} (${ik.satuan})</option>`;
            }).join('');
            updateDirAnggaranPreview();
        }

        function updateDirAnggaranPreview() {
            const sel = document.getElementById('dirIndikatorRenstra');
            if (!sel || sel.options.length === 0) return;
            const opt = sel.options[sel.selectedIndex];
            const target = opt.getAttribute('data-target') || '100';
            const anggaran = parseFloat(opt.getAttribute('data-anggaran') || '0');
            
            document.getElementById('previewTargetVal').innerText = target;
            document.getElementById('previewAnggaranVal').innerText = `Rp ${Number(anggaran).toLocaleString('id-ID')}`;
        }

        function updateTimDirRefOptions(tahun) {
            const sel = document.getElementById('timDirRef');
            if (!sel) return;
            const matching = DB.cascadingDirektur.filter(c => c.timKeys.includes(currentUser.timKey) && (c.tahun || '2025') === tahun);
            sel.innerHTML = matching.length === 0 ? '<option value="">Tidak ada indikator dicascading pada tahun ini</option>' : matching.map(c => `<option value="${c.target}" data-targetval="${c.targetVal !== undefined ? c.targetVal : 100}" data-satuan="${c.satuan || '%'}">${c.target} (Target: ${c.targetVal !== undefined ? c.targetVal : 100} ${c.satuan || '%'})</option>`).join('');

        function openCascadingDirModal() {
            if (DB.renstraIndikatorKinerja.length === 0) {
                showToast('Belum ada data Indikator Kinerja di Renstra. Minta Admin untuk mengisi Renstra terlebih dahulu.', 'error');
                return;
            }
            document.getElementById('cascadingDirModal').classList.remove('hidden'); document.getElementById('cascadingDirModal').classList.add('flex');
            const yrDir = document.getElementById('dirTahunTarget');
            if (yrDir) updateDirRenstraOptions(yrDir.value);
        }
        function closeCascadingDirModal() { document.getElementById('cascadingDirModal').classList.remove('flex'); document.getElementById('cascadingDirModal').classList.add('hidden'); }
        
        async function saveCascadingDir(e) {
            e.preventDefault();
            const tahun = document.getElementById('dirTahunTarget').value;
            const sel = document.getElementById('dirIndikatorRenstra');
            const opt = sel.options[sel.selectedIndex];
            const indikatorName = opt.getAttribute('data-nama');
            const satuan = opt.getAttribute('data-satuan');
            const targetVal = parseFloat(opt.getAttribute('data-target')) || 100;
            const anggaran = parseFloat(opt.getAttribute('data-anggaran')) || 0;
            const checked = Array.from(document.querySelectorAll('input[name="timCheck"]:checked')).map(el => el.value);
            
            if (checked.length === 0) {
                showToast('Pilih minimal 1 Ketua Tim Kerja!', 'error');

        async function saveCapaian(e) {
            e.preventDefault();
            const editId = document.getElementById('editCapaianId').value;
            const targetDirRef = document.getElementById('inputIndikatorRef').value;
            const tw = document.getElementById('inputTriwulan').value;
            const selectEl = document.getElementById('inputIndikatorRef');
            const selectedOpt = selectEl.options[selectEl.selectedIndex];
            const tahunRef = selectedOpt ? selectedOpt.getAttribute('data-tahun') : '2025';
            const timKeyRef = selectedOpt ? selectedOpt.getAttribute('data-timkey') : 'Akademik';

            if (!editId) {
                const exists = DB.capaian.find(c => c.unit === currentUser.unit && c.targetDirektur === targetDirRef && c.triwulan === tw && c.tahun === tahunRef);
                if (exists) {
                    showToast(`Indikator ini untuk periode ${tw} (${tahunRef}) sudah diintervensi oleh program kerja "${exists.program}"!`, 'error');
                    return;
                }
            } else {
                const exists = DB.capaian.find(c => c.unit === currentUser.unit && c.targetDirektur === targetDirRef && c.triwulan === tw && c.tahun === tahunRef && c.id !== editId);
                if (exists) {
                    showToast(`Indikator ini untuk periode ${tw} (${tahunRef}) sudah ada pada entri lain!`, 'error');
                    return;
                }
            }

            const prog = document.getElementById('inputProgram').value;
            const satuan = document.getElementById('inputSatuan').value;
            const target = parseFloat(document.getElementById('inputTarget').value);
            const real = parseFloat(document.getElementById('inputRealisasi').value);
            const linkBukti = document.getElementById('inputLinkBukti').value;
            const perm = document.getElementById('inputPermasalahan').value;

            if (editId) {
                const idx = DB.capaian.findIndex(c => c.id === editId);
                if (idx !== -1) {
                    if (DB.capaian[idx].status === 'Valid') {
                        showToast('Data tervalidasi tidak dapat diubah!', 'error');
                        return;
                    }
                    DB.capaian[idx].targetDirektur = targetDirRef;
                    DB.capaian[idx].tahun = tahunRef;
                    DB.capaian[idx].timKey = timKeyRef;
                    DB.capaian[idx].program = prog;
                    DB.capaian[idx].triwulan = tw;
                    DB.capaian[idx].satuan = satuan;
                    DB.capaian[idx].target = target;
                    DB.capaian[idx].realisasi = real;
                    DB.capaian[idx].linkBukti = linkBukti;
                    DB.capaian[idx].permasalahan = perm;
                    await syncToGoogleSheets('Capaian Kinerja (Edit)', DB.capaian[idx]);
                }
                showToast('Capaian kinerja berhasil diperbarui!');
            } else {
                const newCapaian = {
                    id: 'cp' + (DB.capaian.length + 1),
                    unit: currentUser.unit,
                    timKey: timKeyRef,
                    targetDirektur: targetDirRef,
                    tahun: tahunRef,
                    program: prog,
                    triwulan: tw,
                    satuan: satuan,
                    target: target,
                    realisasi: real,
                    status: 'Menunggu Validasi',
                    permasalahan: perm,
                    rekomendasi: '',
                    penyesuaian: [],
                    linkBukti: linkBukti,
                    statusTindakLanjut: 'Belum Ditindaklanjuti',
                    linkBuktiTindakLanjut: ''
                };
                DB.capaian.push(newCapaian);
                await syncToGoogleSheets('Capaian Kinerja', newCapaian);
                showToast('Capaian kinerja berhasil diinput & disinkronkan ke Google Sheets!');
            }

            await saveToMySQL();
            closeCapaianModal();
            renderCapaianView(document.getElementById('mainContent'));
        }

    function syncUnitListFromUsers() {
        const defaultUnits = [
            'Prodi TMIP', 'Prodi TIIP', 'Prodi TPIP', 'UPPM', 'LSP', 'CDC', 
            'Inkubator Bisnis', 'Transformasi Digital 4.0', 'SPM', 'PMB', 
            'Subbag Umum dan Keuangan', 'Subbag Akademik Kemahasiswaan dan Kerjasama'
        ];
        const userUnits = DB.users
            .filter(u => u.role === 'ketua_unit' && u.unit && u.unit.trim() !== '')
            .map(u => u.unit.trim());
        
        // Gabungkan unit bawaan dengan unit baru dari user tanpa duplikat
        DB.unitList = Array.from(new Set([...defaultUnits, ...userUnits]));
    }

    async function saveUser(e) {
        e.preventDefault();
        const idx = parseInt(document.getElementById('editUserIndex').value);
        const userData = {
            id: idx !== -1 ? DB.users[idx].id : 'u' + (Date.now()),
            name: document.getElementById('uName').value.trim(),
            username: document.getElementById('uUsername').value.trim(),
            password: document.getElementById('uPassword').value.trim(),
            role: document.getElementById('uRole').value,
            timKey: document.getElementById('uTimKey').value,
            unit: document.getElementById('uUnit').value.trim()
        };

        if (idx !== -1) {
            DB.users[idx] = userData;
            showToast('Data pejabat berhasil diperbarui!');
        } else {
            DB.users.push(userData);
            showToast('Pejabat baru berhasil ditambahkan!');
        }

        // Sinkronkan unit baru ke DB.unitList agar muncul di Cascading & Dashboard
        syncUnitListFromUsers();

        await saveToMySQL();
        closeUserModal();
        renderAdminView(document.getElementById('mainContent'));
    }

    async function confirmDeleteUser(idx) {
        const u = DB.users[idx];
        if (u.username === 'admin') {
            showToast('Akun Administrator utama tidak dapat dihapus!', 'error');
            return;
        }
        if (confirm(`Apakah Anda yakin ingin menghapus user "${u.name}" (${u.username})?`)) {
            DB.users.splice(idx, 1);
            syncUnitListFromUsers();
            await saveToMySQL();
            showToast('User berhasil dihapus.', 'info');
            renderAdminView(document.getElementById('mainContent'));
        }
    }

            document.getElementById('printPeriodeTitle').innerText = `Periode: ${periode} | Unit: ${currentUser.unit}`;
            
            document.getElementById('lblJabatan1').innerText = document.getElementById('customJabatan1').value;
            document.getElementById('lblNama1').innerText = document.getElementById('customNama1').value;
            document.getElementById('lblJabatan2').innerText = document.getElementById('customJabatan2').value;
            document.getElementById('lblNama2').innerText = document.getElementById('customNama2').value;
            document.getElementById('lblJabatan3').innerText = document.getElementById('customJabatan3').value;
            document.getElementById('lblNama3').innerText = document.getElementById('customNama3').value;

            const isKaUnit = currentUser.role === 'ketua_unit';
            const isTim = currentUser.role === 'tim_kerja';

            let validCapaian = DB.capaian.filter(c => c.status === 'Valid');
            if (periode !== 'Semua') {
                validCapaian = validCapaian.filter(c => c.triwulan === periode);
            }
            if (isKaUnit) {
                validCapaian = validCapaian.filter(c => c.unit === currentUser.unit);
            } else if (isTim) {
                validCapaian = validCapaian.filter(c => c.timKey === currentUser.timKey);
            }

            const tbody = document.getElementById('printTableBody');
            tbody.innerHTML = validCapaian.length === 0 ? '<tr><td colspan="6" class="p-4 text-center text-slate-400 border">Belum ada data tervalidasi untuk periode ini</td></tr>' : validCapaian.map(c => `
                <tr>
                    <td class="p-2 border">${c.unit}</td>
                    <td class="p-2 border font-semibold text-primary-700">${c.targetDirektur}</td>
                    <td class="p-2 border font-medium">${c.program}</td>
                    <td class="p-2 border">${c.triwulan} (${c.satuan || '%'})</td>
                    <td class="p-2 border">${c.target} / ${c.realisasi}</td>
                    <td class="p-2 border">
                        <span class="font-semibold text-emerald-700">${c.status}</span>
                        <span class="block text-[10px] text-slate-600">Tindak Lanjut: ${c.statusTindakLanjut || 'Belum'}</span>
                    </td>
                </tr>
            `).join('');

            window.print();
        }

        function downloadCSV() {
            const chk_unit = document.getElementById('chk_unit').checked;
            const chk_indikator = document.getElementById('chk_indikator').checked;
            const chk_program = document.getElementById('chk_program').checked;
            const chk_periode = document.getElementById('chk_periode').checked;
            const chk_target = document.getElementById('chk_target').checked;
            const chk_status = document.getElementById('chk_status').checked;
            const chk_tindak = document.getElementById('chk_tindak').checked;

            let headers = [];
            if (chk_unit) headers.push("Unit");
            if (chk_indikator) headers.push("Indikator Utama");
            if (chk_program) headers.push("Program Kerja");
            if (chk_periode) headers.push("Periode");
            if (chk_target) headers.push("Target", "Realisasi");
            if (chk_status) headers.push("Status Validasi");
            if (chk_tindak) headers.push("Tindak Lanjut");

            let csvRows = [headers.join(",")];
            DB.capaian.forEach(c => {
                let row = [];
                if (chk_unit) row.push(`"${c.unit}"`);
                if (chk_indikator) row.push(`"${c.targetDirektur}"`);
                if (chk_program) row.push(`"${c.program}"`);
                if (chk_periode) row.push(`"${c.triwulan}"`);
                if (chk_target) row.push(c.target, c.realisasi);
                if (chk_status) row.push(`"${c.status}"`);
                if (chk_tindak) row.push(`"${c.statusTindakLanjut}"`);
                csvRows.push(row.join(","));
            });

            const blob = new Blob([csvRows.join("\n")], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'laporan_ki_jaro.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('File CSV berhasil diunduh!');
        }

        // === SINKRONISASI STABIL & LENGKAP KE MYSQL ===
        async function loadDataFromMySQL() {
            try {
                const response = await fetch('/api/load-state/main_kijaro');
                const result = await response.json();
                if (result.success && result.data) {
                    Object.assign(DB, result.data);
                    console.log("Data berhasil dimuat dari MySQL.");
                }
            } catch (e) {
                console.error("Gagal memuat dari MySQL:", e);
            }
        }

        async function saveToMySQL() {
            try {
                const res = await fetch('/api/save-state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        key: 'main_kijaro',
                        value: DB
                    })
                });
                const json = await res.json();
                console.log("Data tersimpan ke MySQL:", json);
            } catch (e) {
                console.error("Gagal menyimpan ke MySQL:", e);
            }
        }

        window.onload = async function() {
            await loadDataFromMySQL();
            const savedUser = localStorage.getItem('ki_jaro_user');
            if (savedUser) {
                try {
                    const parsed = JSON.parse(savedUser);
                    const freshUser = DB.users.find(u => u.username === parsed.username);
                    currentUser = freshUser || parsed;
                    renderDashboardLayout();
                } catch (e) {
                    renderLogin();
                }
            } else {
                renderLogin();
            }
        };
    </script>
