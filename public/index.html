        // ============================================================================
        // 2. SAFE DATA MERGE & PERSISTENCE (MYSQL + LOCALSTORAGE)
        // ============================================================================
        function sanitizeAndMergeDB(incoming) {
            if (!incoming || typeof incoming !== 'object') return;

            if (incoming.value && typeof incoming.value === 'object') {
                incoming = incoming.value;
            } else if (incoming.data && typeof incoming.data === 'object') {
                incoming = incoming.data;
            }

            if (Array.isArray(incoming.users) && incoming.users.length > 0) {
                DB.users = incoming.users;
            } else if (!Array.isArray(DB.users) || DB.users.length === 0) {
                DB.users = JSON.parse(JSON.stringify(DEFAULT_USERS));
            }

            DB.timKerjaList = (Array.isArray(incoming.timKerjaList) && incoming.timKerjaList.length > 0) ? incoming.timKerjaList : DEFAULT_TIM_LIST.slice();
            DB.unitList = (Array.isArray(incoming.unitList) && incoming.unitList.length > 0) ? incoming.unitList : DEFAULT_UNIT_LIST.slice();

            var arrayFields = [
                'renstraTujuanKemenperin', 'renstraBPSDMI', 'renstraSasaranKinerja', 'renstraIndikatorKinerja',
                'cascadingDirektur', 'cascadingTim', 'capaian', 'risiko', 'realisasiAnggaranAdmin'
            ];
            for (var i = 0; i < arrayFields.length; i++) {
                var field = arrayFields[i];
                if (Array.isArray(incoming[field])) {
                    DB[field] = incoming[field];
                } else if (!Array.isArray(DB[field])) {
                    DB[field] = [];
                }
            }

            if (Array.isArray(incoming.dokumenPerencanaan)) {
                DB.dokumenPerencanaan = incoming.dokumenPerencanaan;
            }
            if (incoming.spreadsheetUrl) {
                DB.spreadsheetUrl = incoming.spreadsheetUrl;
            }
            if (incoming.lastUpdated) {
                DB.lastUpdated = Number(incoming.lastUpdated) || 0;
            }
        }

        function countTotalRecords(obj) {
            if (!obj || typeof obj !== 'object') return 0;
            if (obj.value && typeof obj.value === 'object') obj = obj.value;
            if (obj.data && typeof obj.data === 'object') obj = obj.data;
            return (
                (Array.isArray(obj.renstraTujuanKemenperin) ? obj.renstraTujuanKemenperin.length : 0) +
                (Array.isArray(obj.renstraBPSDMI) ? obj.renstraBPSDMI.length : 0) +
                (Array.isArray(obj.renstraSasaranKinerja) ? obj.renstraSasaranKinerja.length : 0) +
                (Array.isArray(obj.renstraIndikatorKinerja) ? obj.renstraIndikatorKinerja.length : 0) +
                (Array.isArray(obj.cascadingDirektur) ? obj.cascadingDirektur.length : 0) +
                (Array.isArray(obj.cascadingTim) ? obj.cascadingTim.length : 0) +
                (Array.isArray(obj.capaian) ? obj.capaian.length : 0) +
                (Array.isArray(obj.risiko) ? obj.risiko.length : 0) +
                (Array.isArray(obj.realisasiAnggaranAdmin) ? obj.realisasiAnggaranAdmin.length : 0)
            );
        }

        function loadFromLocalCache() {
            try {
                var raw = localStorage.getItem(LS_DB_KEY);
                if (raw) {
                    var parsed = JSON.parse(raw);
                    sanitizeAndMergeDB(parsed);
                    return parsed;
                }
            } catch (e) {
                console.warn("Gagal membaca cache lokal:", e);
            }
            return null;
        }

        function saveToLocalCache() {
            try {
                localStorage.setItem(LS_DB_KEY, JSON.stringify(DB));
            } catch (e) {
                console.warn("Gagal menyimpan ke cache lokal:", e);
            }
        }

        async function loadDataFromMySQL() {
            var localCopy = loadFromLocalCache();
            var localRecords = countTotalRecords(localCopy);
            var localTime = localCopy && localCopy.lastUpdated ? Number(localCopy.lastUpdated) : 0;

            try {
                var response = await fetch('/api/load-state/main_kijaro?t=' + Date.now(), {
                    method: 'GET',
                    headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
                });

                if (response.ok) {
                    var result = await response.json();
                    var serverData = null;

                    if (result && result.data) {
                        serverData = typeof result.data === 'string' ? JSON.parse(result.data) : result.data;
                    } else if (result && result.value) {
                        serverData = typeof result.value === 'string' ? JSON.parse(result.value) : result.value;
                    } else if (result && Array.isArray(result.users)) {
                        serverData = result;
                    }

                    if (serverData && typeof serverData === 'object') {
                        var serverRecords = countTotalRecords(serverData);
                        var serverTime = Number(serverData.lastUpdated || 0);

                        if (serverRecords > 0 || serverTime >= localTime) {
                            sanitizeAndMergeDB(serverData);
                            saveToLocalCache();
                        } else if (localRecords > 0 && serverRecords === 0) {
                            await pushStateToMySQL();
                        }
                        isServerConnected = true;
                        updateStatusIndicator();
                        return true;
                    } else if (localRecords > 0) {
                        await pushStateToMySQL();
                        isServerConnected = true;
                        updateStatusIndicator();
                        return true;
                    }
                }
            } catch (e) {
                console.warn("Info Koneksi MySQL:", e);
            }

            isServerConnected = false;
            updateStatusIndicator();
            return false;
        }

        async function pushStateToMySQL() {
            var res = await fetch('/api/save-state', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    key: 'main_kijaro',
                    value: DB
                })
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var json = await res.json();
            isServerConnected = true;
            updateStatusIndicator();
            return json;
        }

        async function saveToMySQL() {
            DB.lastUpdated = Date.now();
            saveToLocalCache();
            try {
                await pushStateToMySQL();
            } catch (e) {
                isServerConnected = false;
                updateStatusIndicator();
                console.warn("Disimpan di memori lokal browser:", e);
            }
        }

        function updateStatusIndicator() {
            var el = document.getElementById('dbStatusBadge');
            if (!el) return;
            if (isServerConnected) {
                el.className = "px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-[11px] font-semibold flex items-center space-x-1.5";

                el.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>Tersimpan Lokal</span>';
            }
        }

        function calculateSkorRisiko(p, d) {
            var val = (parseInt(p, 10) || 1) * (parseInt(d, 10) || 1);
            var kuadran = '';
            var warna = '';
            var level = '';

            if (val >= 20) { level = 'Sangat Tinggi (5)'; kuadran = 'Kuadran IV (Sangat Tinggi)'; warna = 'bg-rose-600 text-white'; }
            else if (val >= 15) { level = 'Tinggi (4)'; kuadran = 'Kuadran III (Tinggi)'; warna = 'bg-amber-500 text-white'; }
            else if (val >= 12) { level = 'Sedang (3)'; kuadran = 'Kuadran II (Sedang)'; warna = 'bg-yellow-400 text-slate-900'; }
            else if (val >= 7) { level = 'Rendah (2)'; kuadran = 'Kuadran I (Rendah)'; warna = 'bg-emerald-500 text-white'; }
            else { level = 'Sangat Rendah (1)'; kuadran = 'Kuadran I (Sangat Rendah)'; warna = 'bg-blue-500 text-white'; }

            return { skor: val, level: level, kuadran: kuadran, warna: warna };
        }

        function showToast(message, type) {
            if (!type) type = 'success';
            var container = document.getElementById('toastContainer');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'px-4 py-3 rounded-xl text-white shadow-lg flex items-center space-x-3 transition-all ' + (
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600'
            );
            var icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            toast.innerHTML = '<i class="fa-solid ' + icon + ' text-lg"></i><span class="text-sm font-medium">' + message + '</span>';
            container.appendChild(toast);
            setTimeout(function() {
                toast.remove();
            }, 3500);
        }

                localStorage.setItem('ki_jaro_user', JSON.stringify(currentUser));
                showToast('Selamat datang, ' + currentUser.name);
                renderDashboardLayout();
            } else {
                showToast('Username atau password salah!', 'error');

        function renderDashboardView(container) {
            document.getElementById('pageTitle').innerText = 'Dashboard Capaian Kinerja & Peta Risiko';
            
            var validCapaian = (DB.capaian || []).filter(c => c.status === 'Valid');
            if (filterDashboardTahun !== 'Semua') validCapaian = validCapaian.filter(c => c.tahun === filterDashboardTahun);
            if (filterDashboardTriwulan !== 'Semua') validCapaian = validCapaian.filter(c => c.triwulan === filterDashboardTriwulan);
            if (filterDashboardTim !== 'Semua') validCapaian = validCapaian.filter(c => c.timKey === filterDashboardTim);
            if (filterDashboardUnit !== 'Semua') validCapaian = validCapaian.filter(c => c.unit === filterDashboardUnit);

            var filteredCascading = DB.cascadingDirektur || [];
            if (filterDashboardTahun !== 'Semua') filteredCascading = filteredCascading.filter(c => c.tahun === filterDashboardTahun);
            if (filterDashboardTim !== 'Semua') filteredCascading = filteredCascading.filter(c => (c.timKeys || []).includes(filterDashboardTim));

            var totalValidIndikator = filteredCascading.length;
            var achievedCount = 0;
            filteredCascading.forEach(cd => {
                var matched = validCapaian.filter(c => c.targetDirektur === cd.target && c.tahun === cd.tahun);
                if (matched.length > 0) {
                    var avgReal = matched.reduce((a,b)=>a+Number(b.realisasi || 0),0)/
